controller_manager:
  ros__parameters:
    update_rate: 50

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

joint_state_broadcaster:
  ros__parameters:
    joints: [left_wheel_joint, right_wheel_joint]

diff_drive_controller:
  ros__parameters:
    left_wheel_names:  [left_wheel_joint]
    right_wheel_names: [right_wheel_joint]
    # Геометрическая колея, замерена рулеткой (совпадает с URDF).
    wheel_separation: 0.347
    wheel_radius: 0.1026

    # Эмпирическая доводка одометрии без пересборки пакета (обновляются в рантайме
    # через ros2 param set).
    # ВАЖНО: линейный масштаб задаётся ТОЛЬКО парой wheel_radius/ticks_per_rev,
    # причём одометрия зависит лишь от их ОТНОШЕНИЯ.
    #
    # Радиусные множители = 1.0 осознанно: wheel_radius выше уже измерен прокатом
    # (2026-07-26), борта разошлись на 0.15% — это ниже шума одного прогона,
    # разделять их смысла нет. Если появится систематический увод одометрии по
    # дуге на прямой — вот тогда разделять left/right.
    #
    # ИЗМЕРЕНО вращением на месте (2026-07-26): поворот ровно на 360 град дал
    # (dR - dL) = 21.792 рад в /joint_states -> ЭФФЕКТИВНАЯ колея
    # 0.1026 * 21.792 / 2pi = 0.3559 м. Это на 2.6% больше геометрических 0.347:
    # широкие шины при развороте на месте скребут боком, пятно контакта уползает
    # наружу, и робот ведёт себя как более широкий. Поэтому в URDF лежит
    # физические 0.347 (там нужна честная геометрия для TF), а разницу забирает
    # множитель: 0.3559 / 0.347 = 1.0259. НЕ СВОДИТЬ эти два числа к одному.
    # Точность одного оборота с прицелом по стене ~1.4%.
    wheel_separation_multiplier: 1.0259
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0

    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_footprint
    cmd_vel_timeout: 0.5

    use_stamped_vel: false

    # Софт-лимиты команд (2026-07-26). До этого лимитов не было вообще, а
    # робот высокий (1.6 м) и тяжёлый — сейчас на него нельзя положиться в
    # смысле ускорений от Nav2 без ограничителя.
    # max_velocity/max_acceleration взяты из RobotSetting.xml (Driving) как
    # заводской консервативный потолок, но не проверялись отдельно — если
    # понадобится более резвое движение, поднимать постепенно и на практике,
    # а не на веру.
    # max_deceleration задан ЗНАЧИТЕЛЬНО выше max_acceleration осознанно:
    # это единственный тормоз, доступный ПО (cmd_vel_timeout зануляет команду,
    # но именно этот лимитер решает, как быстро реальная скорость дойдёт до
    # нуля) — плавный разгон и быстрая остановка, а не наоборот.
    # has_velocity_limits/has_acceleration_limits считаются deprecated в этой
    # версии контроллера (NaN = лимит выключен), поэтому здесь не выставлены.
    # ПОДНЯТО 2026-07-27 с 0.05: заводские 0.05 м/с^2 давали разгон до 0.25 м/с
    # за 5 с, и Nav2 не успевал пройти required_movement_radius за отведённое
    # время -> "Failed to make progress" на каждой цели. 0.3 м/с^2 = 0.03 g.
    linear.x.max_velocity: 0.3
    linear.x.min_velocity: -0.3
    linear.x.max_acceleration: 0.3
    linear.x.max_deceleration: 0.5

    angular.z.max_velocity: 0.5236
    angular.z.min_velocity: -0.5236
    angular.z.max_acceleration: 1.0
    angular.z.max_deceleration: 2.0
