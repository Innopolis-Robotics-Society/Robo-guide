geometry:
  # Замерена рулеткой, центр-в-центр. RobotSetting.xml говорил 0.338 - неверно.
  wheel_separation: 0.347
  # Катучий радиус, замер 2026-07-26: 3.157 м за 30.758 рад.
  # RobotSetting.xml говорил 0.075 - неверно.
  wheel_radius: 0.1026
  wheel_width: 0.048

  body_radius: 0.31
  body_height: 1.62
  body_z: 0.885
  body_x_offset: -0.12

  caster_x: -0.3
  caster_y: 0.12

  # 2026-08-30, стена спереди (+X): ось колёс 0.155, лидары 0.2825.
  # x = d_ось − d_лидар: дальше от стены, чем ось → за осью.
  lidar_x_offset: -0.1275
  # Край–край 0.637, корпус C1 55.6 мм (Slamtec). Центр–центр = 0.637-0.0556.
  lidar_y_offset: 0.2907
  lidar_z: 0.3624               # 0.495 - base_z - 0.03
  # 2026-08-30: вверх ногами (pitch π). Сверху: левый +90° CCW, правый −90° CW.
  lidar_left_yaw: 1.5707963267948966
  lidar_right_yaw: -1.5707963267948966
  sonar_z: 0.2

  footprint_radius: 0.43

odometry:
  # ИЗМЕРЕНО вращением на месте (2026-07-26): поворот ровно на 360 град дал
  # (dR - dL) = 21.792 рад в /joint_states -> эффективная колея
  # 0.1026 * 21.792 / 2pi = 0.3559 м, что на 2.6% больше геометрических 0.347.
  # Широкие шины при развороте скребут боком, пятно контакта уползает наружу.
  # Геометрия остаётся честной (нужна для TF), разницу забирает множитель:
  # 0.3559 / 0.347 = 1.0259. Точность прогона ~1.4%.
  wheel_separation_multiplier: 1.0259
  # Осознанно 1.0: борта разошлись на 0.15%, ниже шума одного прогона.
  # Разделять при систематическом уводе по дуге на прямой.
  left_wheel_radius_multiplier: 1.0
  right_wheel_radius_multiplier: 1.0

limits:
  # УДВОЕНО 2026-07-27. Выше заводского потолка RobotSetting.xml, ничем не
  # подтверждено кроме того, что мотор отработает. Робот 1.6 м и тяжёлый -
  # первый выезд с рукой на стопе.
  # Тормоз намеренно выше разгона: это единственный тормоз, доступный ПО.
  #
  # 2026-07-30: скорость x1.5 (0.6 -> 0.9), торможение /1.5 (1.0 -> 0.67).
  # Запас "тормоз выше разгона" при этом почти съеден: 0.67 против 0.6.
  # Тормозной путь с потолка вырос в 3.4 раза: было 0.6^2/(2*1.0) = 0.18 м,
  # стало 0.9^2/(2*0.67) = 0.60 м. Реально DWB планирует до 0.75 м/с (см.
  # max_vel_x в first_iter_nav2.yaml.in) -> 0.42 м. Полигон SonarStopFront
  # у collision_monitor кончается в 0.35 м от base_link, то есть примерно на
  # кромке корпуса (robot_radius 0.43): срабатывание стоп-полигона на полном
  # ходу больше НЕ означает остановку до контакта. Углы менять парой.
  #
  # 2026-08-10: выяснилось, что до этой даты НИ ОДНО из чисел ниже не доходило
  # до базы. diff_drive_controller применяет лимиты только при
  # has_velocity_limits/has_acceleration_limits = true, а они стояли false (см.
  # controllers.yaml.in). Замер по бэгу: collision_monitor резал команду с 0.75
  # до 0 за один кадр 50 мс (-15.5 м/с^2) и возвращал 0.30 -> 0.75 обратно
  # (+8.0 м/с^2) -- velocity_smoother стоит ДО монитора и его срез не сглаживает.
  # Это и есть "резко тормозит и потом разгоняется".
  # 2026-08-11: потолок опущен 0.9 -> 0.5. Автопрогон (бэг 20260811T121706Z)
  # показал, что привод НАСЫЩАЕТСЯ на ~0.53 м/с: команды 0.60 и 0.70 м/с давали
  # физические 0.525 и 0.532. Всё выше ~0.53 -- команда-фикция, а в насыщении
  # асимметрия бортов максимальна (робота ведёт дугой). Запас 0.03 до потолка.
  max_linear_velocity: 0.5
  max_linear_accel: 0.6
  max_linear_decel: 0.67
  # Тормоз ЖЕЛЕЗА: linear.x.min_acceleration в diff_drive_controller
  # (в Humble нет max_deceleration). Это единственный рамп после
  # collision_monitor, в том числе для телеопа в /cmd_vel.
  # 1.5 стояло на огибающей привода (~1.25 м/с² без лимитера, бэг fp_FINAL) —
  # лимитер почти не резал, 1.62 м / 62 кг клевало носом и раскачивалось.
  # Круиз сейчас 0.4 м/с, не 0.75: путь 0.4²/(2*0.67) = 0.12 м. Совпадает с
  # комфортным max_linear_decel, чтобы cmd_vel и nav тормозили одинаково.
  max_linear_decel_hard: 0.67
  max_angular_velocity: 1.0472
  max_angular_accel: 2.0
  max_angular_decel: 2.0
  # Круиз Nav2 (DWB), уже ПОД связку v+w: пара должна ВМЕСТЕ влезать в потолок
  # привода ~0.53 м/с на колесе. v + w*b_eff/2 <= 0.53, b_eff/2 =
  # 0.347*1.0259/2 = 0.178 м -> 0.40 + 0.6*0.178 = 0.507, запас на разброс
  # пола/батареи. До 2026-08-11 DWB планировал вплоть до (0.5, 1.0): наружное
  # колесо 0.678 м/с молча уходило в насыщение железа, робот недоворачивал
  # ~40% угловой скорости на крутых дугах. max_linear/angular_velocity выше —
  # последний рубеж (сглаживатель, лимитер контроллера), круиз задаётся здесь.
  nav_linear_velocity: 0.4
  nav_angular_velocity: 0.6
  # Запас конверта command_interface над худшим случаем v+w.
  # 1.10 переживает перенастройку wheel_separation_multiplier.
  wheel_limit_margin: 1.10

drive:
  serial_port: /dev/tty_motors     # udev, scripts/99-Guide-Robotevices.rules
  baud_rate: 115200
  left_wheel_id: 46                # 0x2E
  right_wheel_id: 47               # 0x2F
  ticks_per_rev: 131072            # 512 * 4 (квадратура x4, не x8) * 64
  left_sign: 1
  right_sign: -1                   # правое колесо перевёрнуто физически
  swap_drives: 1
  # АВТОТЕСТ 2026-08-11 без teleop/SSH: старое units=v/0.0001706 давало
  # 0.0935/0.1498/0.2231 м/с на командах 0.10/0.20/0.35. Характеристика не
  # проходит через ноль: |v| = offset + coefficient*|units|, R^2=0.997.
  # Плагин инвертирует её КУСОЧНО: выше сшивки ~0.09 м/с аффинная формула,
  # ниже — старая пропорциональная low_speed_coefficient. Жёсткая мёртвая зона
  # "ниже offset = стоп" сломала в тот же день финальный доворот у цели: DWB из
  # покоя сэмплирует угловые в окне ±acc_lim_theta/15Гц ≈ ±0.13 рад/с, а порог
  # вращения offset/(wheel_separation/2) ≈ 0.25 рад/с — робот не мог НАЧАТЬ
  # поворот и репланировал раз в секунду, стоя на месте.
  speed_coefficient: 0.0000880243  # наклон, м/с на motor unit
  speed_offset: 0.0436513          # минимальная скорость аффинного участка, м/с
  low_speed_coefficient: 0.0001706 # пропорциональный участок ниже сшивки, м/с на unit
  # Левый борт отзывчивее правого при равных units: |v_L|/|v_R| = 1.014-1.028
  # на всех ступенях 0.35-0.70 м/с в обе стороны (бэг 20260811T121706Z), робота
  # ведёт дугой вправо 1.4-2.4 град/с. Масштабируется только КОМАНДА левого
  # колеса, одометрия с энкодеров не трогается.
  # Первое значение 0.982 ПЕРЕкомпенсировало на другом покрытии (бэг
  # 20260811T124015Z: увод +10.3° вместо -27.1°, знак асимметрии перевернулся,
  # общий отклик моторов между прогонами плавает на 2-5%). Остаточная дуга на
  # уровне шума пол/ролики/батарея — дальше 0.990 не подкручивать, фиксированный
  # трим точнее не сделать.
  left_speed_trim: 0.990
  # Сторож команд. У драйвера FURO своего таймаута НЕТ: без этого зависший
  # управляющий цикл = робот едет с последней принятой скоростью до упора.
  # Плагин отказывается активироваться при значении <= 0 — не «оптимизировать».
  cmd_timeout: 0.3
  # Сколько секунд подряд плагин терпит отсутствие валидных кадров энкодеров,
  # прежде чем уйти в ERROR и остановить моторы. Считать надо по темпу ПРОШИВКИ
  # (~215 мс, 4.6 Гц), а не по темпу запросов: 3.0 с — это ~14 пропущенных
  # кадров подряд, не единичный сбой checksum. Прежняя 1.0 с давала запас всего
  # в ~4.6 кадра и роняла компонент на старте, пока драйвер просыпается.
  # 0 выключает проверку: робот будет ехать с замороженной одометрией.
  encoder_timeout: 3.0
  # Граница, на которой прошивка FURO теряет перенос счётчика позиции: она
  # скачком уезжает ровно на 2^16 тиков (= pi рад на колесе) и назад не
  # возвращается. Плагин чинит такой разрыв разворачиванием (correctTickDelta).
  # 0 выключает ремонт — скачок уедет в одометрию как настоящий поворот.
  encoder_wrap_ticks: 65536
  # Раз во сколько циклов управления опрашиваются энкодеры. Темп кадров этим
  # не поднять: прошивка отдаёт позицию со своим периодом ~215 мс (4.6 Гц) и на
  # более частые запросы молчит — при 5 -> 1 темп не изменился, только выросла
  # нагрузка на шину. Читается xacro при запуске, пересборка не нужна.
  encoder_poll_divider: 5
  # Ускорение в единицах прошивки FURO. Вендором не задокументировано, к
  # limits.max_linear_accel отношения не имеет; 1000 — значение, на котором
  # база откатана. Менять только с проездом на месте.
  motor_accel: 1000

sensors:
  # RPLIDAR C1. Этим же числом режет dual_laser_merger (lidars.launch.py /
  # perception.launch.py), и по нему AMCL решает, считать ли возврат
  # "максимальной дальностью".
  lidar_range_max: 12.0

controller_manager:
  update_rate: 50
  publish_rate: 50.0               # точка обязательна: параметр типа double





# =============================================================================
# Guide robot — физические параметры робота
# Источники: RobotSetting.xml (механика) и config.txt (секция FURO)
# Все числа собраны здесь, чтобы не дублировать их по URDF/YAML.
# ЗАМЕЧАНИЕ: значения, помеченные [ПРОВЕРИТЬ], надо верифицировать на роботе.
# =============================================================================
old:
  mechanic:
    # --- Привод (из RobotSetting.xml/Mechanic) ---
    # ИЗМЕРЕНО (2026-07-26): рулетка между серединами протекторов дала 0.347.
    # RobotSetting.xml утверждал 0.338 — соврал и здесь тоже.
    # Тест вращением на 360 град дал ЭФФЕКТИВНУЮ колею 0.3559 (шины скребут боком
    # при развороте на месте). В контроллер идёт 0.347 * wheel_separation_multiplier
    # 1.0259; в URDF — физические 0.347. Подробности в guide_robot_controllers.yaml.
    wheel_base:        0.347    # WheelBase, м (геометрическая)
    wheel_base_effective: 0.3559 # то, что видит одометрия
    # ИЗМЕРЕНО на роботе (2026-07-26): прокат по полу на 3.157 м дал 30.758 рад
    # в /joint_states -> r = 3.157 / 30.758 = 0.1026 м. Это РАДИУС КАЧЕНИЯ под
    # нагрузкой, именно он нужен одометрии. Замер рулеткой по диаметру давал 20 см
    # (занижен на 2.5%). RobotSetting.xml утверждал 0.15 м — неверно для
    # установленных колёс, железо переделывали.
    wheel_diameter:    0.2052   # WheelDiameter, м
    wheel_radius:      0.1026   # = WheelDiameter / 2

    # Энкодерная константа: тиков на ОДИН оборот колеса.
    # = MotorPulse * MotorMultiplier * GearRatio = 512 * 4 * 64
    # ИЗМЕРЕНО: один оборот колеса вручную даёт 3.03 рад в /joint_states вместо
    # 2*pi при ticks_per_rev=262144 -> константа была завышена ровно вдвое.
    # Квадратурный декодер даёт x4, а не x8 как было записано из документации.
    motor_pulse:       512
    motor_multiplier:  4
    gear_ratio:        64
    ticks_per_rev:     131072  # 512 * 4 * 64

    # Знаки направления вращения колёс
    left_reverse:      -1       # RytSetting LeftReverse / config FURO_SIGN_LEFT
    right_reverse:     1        # RightReverse / FURO_SIGN_RIGHT

  driving:
    # Лимиты из RobotSetting.xml/Driving
    max_linear_velocity:   0.3   # м/с
    min_linear_velocity:  -0.3   # м/с
    linear_acceleration:   0.01  # м/с^2 (штатный, очень мягкий)
    max_angular_velocity:  0.5236 # 30 град/с -> рад/с
    min_angular_velocity: -0.5236
    angular_acceleration:  2.0   # рад/с^2 (штатный)
    proximity_limit_range: 0.3   # м, дистанция срабатывания защиты

  serial:
    # --- Порт и коэффициенты (из config.txt, секция FURO) ---
    # ВНИМАНИЕ: config указывает COM7 для базы, тестовый скрипт слушал COM3.
    com_port_windows:  "COM7"          # FURO_ROBOT_COM_PORT
    com_port_linux:    "/dev/tty_motors"
    baud_rate:         115200

    left_wheel_id:     0x2E   # 46 — ID левого драйва (из тестового Sync Write)
    right_wheel_id:    0x2F   # 47 — ID правого драйва
    swap_drives:       1      # FURO_SWAP_DRIVES — левый/правый переставлены!

    # ИЗМЕРЕНО на роботе (2026-07-26): команда 0.2 м/с дала в среднем 0.0426 м/с
    # по одометрии (3 прогона по 5с: 0.0418/0.0436/0.0425, разброс ~4%) ->
    # реальный коэффициент 0.0008 * (0.0426/0.2) = 0.0001706 м/с/единицу. Это
    # близко к вендорскому config.txt (0.014 СМ/с = 0.00014 м/с), расхождение
    # ~20%, а не в 5.7 раз как было со старым 0.0008 в ros2_control.xacro.
    # Значение применено в guide_robot.ros2_control.xacro и в hpp-дефолте.
    speed_coefficient: 0.014     # FURO_ROBOT_SPEED_COEFFICIENT (попугаи -> СМ/с), справочно
    spin_coefficient:  3.0e-4    # FURO_ROBOT_SPIN_COEFFICIENT  (попугаи -> рад/с)
    speed_scale:       1.0       # FURO_SPEED_SCALE

  # =============================================================================
  # Парктроники (RangeSensors из RobotSetting.xml)
  # Позиции даны в системе base_link. direction — азимут луча (градусы).
  # sensingAngle 65° — ширина конуса. Индексы соответствуют порядку в XML.
  # Нулевые/пустые сенсоры (#4 и #8 в XML) исключены как заглушки.
  # =============================================================================
  range_sensors:
    frame_prefix: "range_sensor_"
    field_of_view: 1.134   # 65 град -> рад
    min_range: 0.1
    max_range: 2.0         # TO-DO реальный диапазон парктроника
    sensors:
      - { id: 1, x:  0.061107, y:  0.215993, yaw:  42.03 }
      - { id: 2, x: -0.040039, y:  0.260183, yaw:  90.0 }
      - { id: 4, x: -0.393220, y:  0.132040, yaw: 138.03 }
      - { id: 5, x: -0.435289, y:  0.000000, yaw: 180.0 }
      - { id: 6, x: -0.393220, y: -0.132040, yaw: -138.03 }
      - { id: 8, x: -0.040039, y: -0.260183, yaw: -90.0 }
      - { id: 9, x:  0.061107, y: -0.215993, yaw: -42.03 }
