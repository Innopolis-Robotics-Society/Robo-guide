; card_provision -- утилита персонализации карт операторов.
; Прошивается на ту же плату, что и rfid_bridge. См. README.md рядом.

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; Те же флаги, что в ../rfid_bridge/platformio.ini -- манифест платы
; жёстко задаёт -DARDUINO_USB_MODE=1 и перетирает build_flags.
board_build.extra_flags =
    -DARDUINO_ESP32S3_DEV
    -DARDUINO_RUNNING_CORE=1
    -DARDUINO_EVENT_RUNNING_CORE=1

build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Отдельный серийник: пока залита эта прошивка, плата НЕ должна
    ; матчиться udev-правилом ридера -- иначе узел откроет /dev/rfid0
    ; и упрётся в REPL прошивальщика.
    -D USB_SERIAL=\"guide-robot-card-provision\"

lib_deps =
    miguelbalboa/MFRC522@^1.4.11
