; rfid_bridge -- прошивка ESP32-S3 моста RFID (Task E4/E5).
; Сборка/прошивка: см. README.md рядом.

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; Манифест платы (boards/esp32-s3-devkitc-1.json) жёстко задаёт
; -DARDUINO_USB_MODE=1 в build.extra_flags, а они подставляются ПОСЛЕ
; build_flags -- при двух одинаковых -D в командной строке побеждает
; последний, и значение из build_flags перетирается молча. Переопределяем
; список платы целиком, без USB_MODE; остальные три флага скопированы из
; манифеста как есть (потеря ARDUINO_ESP32S3_DEV или *_RUNNING_CORE даёт
; менее очевидные поломки). build_unflags здесь не работает: он не
; доходит до сборки ядра Arduino, а USB.begin() живёт именно там.
board_build.extra_flags =
    -DARDUINO_ESP32S3_DEV
    -DARDUINO_RUNNING_CORE=1
    -DARDUINO_EVENT_RUNNING_CORE=1

build_flags =
    ; Нативный USB CDC (TinyUSB) вместо аппаратного USB-Serial-JTAG.
    ; MODE=0 обязателен: только при нём ядро зовёт USB.begin() (см.
    ; cores/esp32/main.cpp), и у дескриптора появляется задаваемый
    ; серийный номер. При MODE=1 плата перечисляется как
    ; "USB JTAG/serial debug unit" с серийником, равным MAC.
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Серийник USB-дескриптора (design E5) -- задаётся на компиляции,
    ; потому что USB.begin() в ядре вызывается ДО setup(), а
    ; ESPUSB::serialNumber() после старта молча возвращает false.
    ; УНИКАЛЬНЫЙ НА ВЕСЬ ПАРК, не только на одну плату. Значение должно
    ; совпадать с ATTRS{serial} в scripts/99-guide-robot-rfid.rules.
    -D USB_SERIAL=\"guide-robot-rfid-01\"

lib_deps =
    miguelbalboa/MFRC522@^1.4.11
