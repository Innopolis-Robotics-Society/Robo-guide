; rfid_bridge -- прошивка ESP32-S3 моста RFID (Task E4/E5).
; Сборка/прошивка: см. README.md рядом.

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    ; Нативный USB CDC с самого boot -- иначе Serial уходит через
    ; UART0-переходник, а USB.serialNumber() (design E5) не на что вешать.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    miguelbalboa/MFRC522@^1.4.11
