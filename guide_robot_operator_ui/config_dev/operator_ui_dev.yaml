# Дев-конфиг для ноутбука без робота.
#
# НЕ устанавливается colcon'ом -- setup.py ставит только config/*.yaml.
# Подключать явным путём:
#
#   ros2 launch guide_robot_operator_ui operator_ui.launch.py \
#       params_file:=$(pwd)/guide_robot_operator_ui/config_dev/operator_ui_dev.yaml
#
# Токен моста (общий секрет с guide-launcher) -- любой непустой файл:
#   mkdir -p ~/.guide_launcher && head -c 32 /dev/urandom | base64 > ~/.guide_launcher/bridge_token
# Тот же файл указать в bridge_token_file конфига launcher'а.
# Остальные параметры не перечислены -- у них уже есть дефолты в коде
# ноды (operator_ui_node.py), совпадающие с config/operator_ui.yaml.

/**/operator_ui:
  ros__parameters:
    bridge_token_file: "~/.guide_launcher/bridge_token"
