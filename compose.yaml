x-common: &common-setup
  network_mode: host
  privileged: true
  volumes:
    - ${HOME}/.Xauthority:/home/fabian/.Xauthority:rw
    - .:/home/fabian/ros2_ws/src:rw
    # colcon пишет сюда, не в образ. Иначе `compose run --rm` каждый раз
    # пустой install и нужна полная пересборка. Уже в .gitignore.
    - ./build:/home/fabian/ros2_ws/build:rw
    - ./install:/home/fabian/ros2_ws/install:rw
    - ./log:/home/fabian/ros2_ws/log:rw
    - /tmp/.X11-unix:/tmp/.X11-unix:rw
    - /dev/dri:/dev/dri:rw
    - /dev:/dev:rw
    # PulseAudio
    - /run/user/1000/pulse:/run/user/1000/pulse
    - ${HOME}/.config/pulse/cookie:/home/fabian/.config/pulse/cookie:ro
  environment:
    - NVIDIA_VISIBLE_DEVICES=all
    - NVIDIA_DRIVER_CAPABILITIES=compute,utility,video,graphics,display
    - DISPLAY
    - QT_X11_NO_MITSHM=1
    - PULSE_SERVER=unix:/run/user/1000/pulse/native
    - XDG_RUNTIME_DIR=/run/user/1000
  working_dir: /home/fabian/ros2_ws
  group_add:
    - "video"
    - "44"
    - "${DIALOUT_GID:-20}"
    - "tty"
    - "audio"
  command: [
    "/bin/bash","-lc","
    sudo chown $(whoami):$(whoami) /home/fabian/ros2_ws /home/fabian/ros2_ws/build /home/fabian/ros2_ws/install /home/fabian/ros2_ws/log 2>/dev/null || true &&
    grep -q ros2_ws/install/setup.bash ~/.bashrc || echo '[ -f /home/fabian/ros2_ws/install/setup.bash ] && source /home/fabian/ros2_ws/install/setup.bash' >> ~/.bashrc &&
    exec bash"
    ]

services:
  amd-terminal:
    <<: *common-setup
    image: fabook/iros:x86-cpu
    stdin_open: true
    tty: true
    devices:
      - "/dev/ttyACM0:/dev/ttyACM0"

  jetson:
    <<: *common-setup
    image: fabook/iros:jetson
    runtime: nvidia
    stdin_open: true
    tty: true
    volumes:
      - ${HOME}/.Xauthority:/home/fabian/.Xauthority:rw
      - .:/home/fabian/ros2_ws/src:rw
      - ./build:/home/fabian/ros2_ws/build:rw
      - ./install:/home/fabian/ros2_ws/install:rw
      - ./log:/home/fabian/ros2_ws/log:rw
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /dev:/dev:rw   # Important for lidars (ttyUSB*) and motors (ttyACM*)
      # PulseAudio. This local `volumes:` key overrides the whole list from
      # x-common, so the two pulse mounts have to be repeated here -- without
      # them PULSE_SERVER (still inherited from x-common) points at nothing.
      # A Bluetooth speaker exists only as a sink inside the host's pulse;
      # there is no ALSA hw: device for it, so this is the only path to it.
      - /run/user/1000/pulse:/run/user/1000/pulse
      - ${HOME}/.config/pulse/cookie:/home/fabian/.config/pulse/cookie:ro

  old-terminal:
    <<: *common-setup
    image: fabook/iros:v0.0.1
    stdin_open: true
    tty: true
