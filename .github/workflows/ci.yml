name: CI
on:
  push:
    branches: [dev]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:                    # ← оба job ВНУТРИ jobs:
  pre-commit:            # ← 2 пробела отступа
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: pre-commit/action@v3.0.1

  build-and-test:
      runs-on: ubuntu-22.04
      container:
        image: fabook/iros:x86-cpu
        options: --user root
      steps:
        - name: Install git-lfs
          shell: bash
          run: |
            apt-get update && apt-get install -y git-lfs
            git lfs install

        - uses: actions/checkout@v4
          with:
            lfs: true
            path: src/Robo-guide

        - name: Upgrade pytest
          # Safety net for a not-yet-rebuilt fabook/iros:x86-cpu: apt's
          # python3-pytest 6.2.5 can't load anyio's pytest11 plugin (needs
          # pytest>=7's _pytest.scope), and every `python3 -m pytest` in the
          # image crashes on it. .docker/common/30-python-common.sh now pins
          # the same version at image build time -- once that image is
          # rebuilt and republished, this step is redundant and can go.
          shell: bash
          run: |
            python3 -m pip install -U "pytest==8.4.2"

        - name: Build
          shell: bash
          run: |
            source /opt/ros/humble/setup.bash
            colcon build --event-handlers console_direct+ \
              --cmake-args -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

        - name: Test
          shell: bash
          run: |
            source /opt/ros/humble/setup.bash
            source install/setup.bash
            colcon test --event-handlers console_direct+ --return-code-on-test-failure

        - name: Test results summary
          if: always()
          shell: bash
          run: |
            source /opt/ros/humble/setup.bash
            colcon test-result --verbose
