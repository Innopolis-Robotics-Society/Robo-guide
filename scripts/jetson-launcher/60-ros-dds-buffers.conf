# DDS стека робота (ставит scripts/jetson-launcher/install.sh). Дефолтных 208 КБ UDP-буфера
# не хватает на старте ~65 ROS-процессов: ядро выбрасывает discovery/ответы сервисов, а Nav2
# lifecycle-менеджеры навсегда виснут на change_state.
net.core.rmem_max=16777216
net.core.rmem_default=8388608
net.core.wmem_max=16777216
