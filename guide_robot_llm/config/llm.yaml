# Параметры tool_broker (llm_plam.md §3). Плоско на верхнем уровне узла --
# по тому же соглашению, что guide_robot_mission_control/config/mission.yaml
# (rclpy.declare_parameter, не вложенные группы).

/**:
  ros__parameters:
    use_sim_time: false

/**/tool_broker:
  ros__parameters:
    service_call_timeout_s: 2.0
    say_result_timeout_s: 15.0
    mission_fsm_ns: "/mission_fsm"
    location_server_ns: "/location_server"
    route_planner_ns: "/route_planner"
    content_server_ns: "/content_server"

# dialog_agent (DIALOG_REWORK_PLAN.md): двухфазный ход поверх llm_client + tool_broker.
# llm.base_urls -- реальный адрес llm_server/ (см. llm_server/.env: LLM_PORT=18080).
/**/dialog_agent:
  ros__parameters:
    llm.base_urls: ["http://127.0.0.1:18080/v1", "http://10.100.20.195:18080/v1"]
    llm.connect_timeout_s: 2.0
    llm.read_timeout_s: 30.0
    llm.api_key: ""
    llm.max_attempts_per_backend: 2
    llm.backoff_s: 0.5
    llm.max_tokens_answer: 160
    # 192, не 128: в JSON действия добавилось поле "think" (1-2 предложения
    # рассуждения до выбора инструмента) -- ему нужен свой запас токенов.
    llm.max_tokens_action: 192
    llm.temperature_answer: 0.6
    llm.temperature_action: 0.0
    # stage5 п.3: только фаза реплики -- фаза действия идёт под грамматикой
    # с temperature 0, штраф повторов там неуместен. Не проверено вживую
    # из этого контейнера, приняли ли параметр llama-server -- см.
    # ../llm_server/README.md.
    llm.answer_frequency_penalty: 0.4
    llm.action_repair_attempts: 1

    system_prompt_path: "$(find-pkg-share guide_robot_llm)/config/system_prompt.txt"
    tool_broker_ns: "/tool_broker"
    service_call_timeout_s: 2.0
    # tool_broker.say_result_timeout_s + запас на сам сетевой круговорот
    # ~/call_tool -- иначе dialog_agent сдаётся раньше, чем tool_broker
    # успевает ответить, и say_ok=False получается на пустом месте.
    say_result_timeout_s: 16.0
    catalog_ns_timeout_s: 5.0

    history.max_entries: 16
    history.trim_to: 8
    history.cap_visitor_chars: 200
    history.cap_robot_chars: 300
    history.cap_event_chars: 120
    history.clear_after_absent_s: 60.0

    answer.max_chars: 400

    # unused: ход к ЛЛМ только после «робот» или окна /speech/wakeword.
    wake_grace_s: 0.0

# interaction_log (llm_plam.md §6): jsonl-sink ходов диалога.
/**/interaction_log:
  ros__parameters:
    log_dir: "~/.guide_robot/llm_turns"
