# Параметры голосового чата с LLM.
#
# say_scope: 2 -- CancelAll.SCOPE_DIALOG / Say.SCOPE_DIALOG (guide_robot_msgs).
# Черновик design-документа оставлял здесь 0 с пометкой "свериться с
# константами SCOPE_*" -- по факту SCOPE_ALL=0, SCOPE_DIALOG=2, и диалоговым
# репликам нужен именно DIALOG: SCOPE_ALL заставил бы любую отмену с любым
# scope гасить и текущий ход чата, а не только адресованные ему.

/**/chat_node:
  ros__parameters:
    backend: "llama_cpp"          # llama_cpp | openai | echo
    base_url: "http://127.0.0.1:8000"
    model: ""
    api_key_env: "LLM_API_KEY"
    system_prompt_file: ""        # пусто -> config/system_prompt.txt
    max_history_turns: 6
    max_tokens: 256
    temperature: 0.7
    stream: true
    first_token_timeout_s: 3.0
    request_timeout_s: 20.0

    require_wakeword: true
    activation_phrases: ["робот", "слушай робот"]
    strip_activation_phrase: true
    engagement_timeout_s: 120.0   # музейный робот Alter-Ego -- не менять без причины
    min_chars: 2
    echo_guard_ms: 0.0            # >0 только когда появятся колонки без AEC

    say_priority: 40
    say_scope: 2                  # SCOPE_DIALOG, см. комментарий вверху файла
    say_max_duration_s: 30.0
    goal_retry_limit: 3
    max_clause_chars: 180
    first_clause_min_chars: 24

    fallback_phrases: ["Извините, сейчас не могу ответить."]
    interrupted_marker: " [прервано]"
    log_dir: "~/.ros/llm_turns"
    diagnostics_hz: 1.0
