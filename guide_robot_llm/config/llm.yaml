# Параметры tool_broker (llm_plam.md §3). Плоско на верхнем уровне узла --
# по тому же соглашению, что guide_robot_mission_control/config/mission.yaml
# (rclpy.declare_parameter, не вложенные группы).

/**:
  ros__parameters:
    use_sim_time: false

/**/tool_broker:
  ros__parameters:
    service_call_timeout_s: 2.0
    # До 400 символов синтеза при естественном темпе занимают заметно больше
    # 15 секунд. Таймаут ждёт фактический Say.Result, а не только принятие goal.
    say_result_timeout_s: 45.0
    mission_fsm_ns: "/mission_fsm"
    location_server_ns: "/location_server"
    route_planner_ns: "/route_planner"
    content_server_ns: "/content_server"

# dialog_agent (DIALOG_REWORK_PLAN.md): двухфазный ход поверх llm_client + tool_broker.
# llm.backends -- лестница деградации, порядок = порядок попыток
# (TASK_external_llm_backend.md §4/§5). Каждое имя из списка обязано иметь
# свою секцию llm.<name>.* -- см. dialog_agent_node.__init__ (декларация
# параметров зависит от llm.backends и происходит один раз, до configure).
/**/dialog_agent:
  ros__parameters:
    # Порядок = порядок лестницы деградации.
    llm.backends: ["selectel", "local", "lan"]

    # Selectel AI Router (внешний OpenAI-совместимый шлюз): GBNF не понимает --
    # гейт инструментов строкой в промпте (structured=json_object).
    # Рассуждения выключаются `reasoning.enabled=false` (замер 24.09.2026:
    # 0 reasoning-токенов; `thinking`/`chat_template_kwargs` роутер игнорирует).
    llm.selectel.base_url: "https://api.selectel.ru/aig/v1"
    llm.selectel.model: "google/gemini-3.5-flash-lite"
    llm.selectel.api_key_env: "SELECTEL_AIG_KEY"
    llm.selectel.structured: "json_object"
    llm.selectel.extra_body_json: '{"stream_options": {"include_usage": true}, "reasoning": {"enabled": false}}'
    llm.selectel.reasoning_budget_tokens: 0
    llm.selectel.connect_timeout_s: 3.0
    llm.selectel.read_timeout_s: 8.0
    llm.selectel.first_content_timeout_s: 6.0   # замерено max 4.9 с
    llm.selectel.max_attempts: 1
    # Стрим закрывается недочитанным -- без прогрева каждый запрос платит
    # TCP+TLS (замер 24.09.2026: ~1.2 с через VPN на ноутбуке).
    llm.selectel.prewarm: true

    # Локальный llm_server/ (llama.cpp, GBNF per-request, см. llm_server/.env:
    # LLM_PORT=18080) -- вторая ступень лестницы, деградация при недоступности
    # или отказе Selectel (401/403/сеть).
    llm.local.base_url: "http://127.0.0.1:18080/v1"
    llm.local.structured: "gbnf"
    llm.local.connect_timeout_s: 2.0
    llm.local.read_timeout_s: 30.0

    # LAN-адрес того же llm_server/ (другой хост в сети) -- третья ступень.
    llm.lan.base_url: "http://10.100.20.195:18080/v1"
    llm.lan.structured: "gbnf"
    llm.lan.connect_timeout_s: 2.0
    llm.lan.read_timeout_s: 30.0

    llm.backoff_s: 0.5
    llm.max_tokens_answer: 160
    # Реплика инлайн (до 160 токенов) + сам JSON действия -- см.
    # TASK_external_llm_backend.md §4 (было 64, хватало только на короткий
    # {"tool","args"} без think и без текста реплики).
    llm.max_tokens_action: 220
    llm.temperature_answer: 0.6
    llm.temperature_action: 0.0
    # stage5 п.3: только фаза реплики -- фаза действия идёт под грамматикой
    # с temperature 0, штраф повторов там неуместен. Не проверено вживую
    # из этого контейнера, приняли ли параметр llama-server -- см.
    # ../llm_server/README.md.
    llm.answer_frequency_penalty: 0.4
    llm.action_repair_attempts: 1

    system_prompt_path: "$(find-pkg-share guide_robot_llm)/config/system_prompt.txt"
    tool_broker_ns: "/tool_broker"
    service_call_timeout_s: 2.0
    # tool_broker.say_result_timeout_s + запас на сам сервисный круговорот.
    # ~/call_tool -- иначе dialog_agent сдаётся раньше, чем tool_broker
    # успевает ответить, и say_ok=False получается на пустом месте.
    say_result_timeout_s: 50.0
    catalog_ns_timeout_s: 5.0

    history.max_entries: 16
    history.trim_to: 8
    history.cap_visitor_chars: 200
    history.cap_robot_chars: 300
    history.cap_event_chars: 120
    history.clear_after_absent_s: 60.0

    answer.max_chars: 400
    # Первое предложение ответа звучит, пока модель дописывает остальное.
    answer.stream_tts: true

    # После ответа разрешить одну естественную follow-up реплику без
    # повторного «Фирая» (например «давай» или «расскажи подробнее»).
    wake_grace_s: 8.0

# interaction_log (llm_plam.md §6): jsonl-sink ходов диалога.
/**/interaction_log:
  ros__parameters:
    log_dir: "~/.guide_robot/llm_turns"
