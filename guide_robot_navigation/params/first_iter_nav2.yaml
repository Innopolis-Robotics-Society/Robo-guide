amcl:
  ros__parameters:
    use_sim_time: False
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    # ИСПРАВЛЕНО 2026-07-27: было 100.0 — дальность, которой у железа нет.
    # RPLIDAR C1 бьёт на 12 м, и dual_laser_merger режет /scan по range_max: 12.0
    # (sensors.launch.py). AMCL клампит каждый луч по laser_max_range и по этому
    # же числу решает, считать ли возврат "максимальной дальностью": при 100.0
    # все 12-метровые лучи проходили как честные измерения препятствия на 12 м.
    laser_max_range: 12.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    # СНИЖЕНО 2026-07-27 вместе с удвоением скоростей. Это пороги, после которых
    # AMCL вообще запускает фильтр; между ними map->odom просто экстраполируется
    # одометрией. Скорости выросли вдвое — при старых порогах то же время между
    # обновлениями превращалось бы в вдвое больший накопленный дрейф, а поворот
    # это как раз самое слабое место одометрии (боковой скреб широких шин).
    # 0.1 рад = 5.7 град: на развороте на 180 град это 31 обновление вместо 15.
    update_min_a: 0.1
    update_min_d: 0.2
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan
    # Стартовая поза для режима slam:=false. По умолчанию AMCL рассыпает частицы
    # вокруг (0, 0) и ждёт "2D Pose Estimate" из RViz. Если робот всегда стартует
    # с одного и того же места (док/парковка), поставить true и вписать позу —
    # тогда стек поднимается локализованным без ручного вмешательства.
    # (0, 0) проверено по lab_map.pgm 2026-07-27: пиксель (col 120, row 223)
    # и вся его окрестность = 254, свободно. То есть поза валидна геометрически.
    # ЧТО ЭТО НЕ ЗНАЧИТ: что робот физически стартует именно там и именно с
    # yaw 0. Если парковка в другом месте — вписать реальные координаты, иначе
    # AMCL стартует уверенно неправильно, а это хуже, чем стартовать неуверенно.
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

amcl_map_client:
  ros__parameters:
    use_sim_time: False

amcl_rclcpp_node:
  ros__parameters:
    use_sim_time: False

bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    # УБРАНО 2026-07-27: здесь стоял
    #   default_bt_xml_filename: "navigate_w_replanning_and_recovery.xml"
    # Этот параметр — из Galactic и раньше. В Humble bt_navigator его не
    # объявляет: он распался на default_nav_to_pose_bt_xml и
    # default_nav_through_poses_bt_xml. Необъявленный параметр из yaml просто
    # молча игнорируется, ошибки нет — то есть строка не делала НИЧЕГО, и всё
    # это время работало дефолтное дерево Humble
    # navigate_to_pose_w_replanning_and_recovery.xml. Оставляем дефолт (он
    # рабочий), но теперь это видно, а не выглядит как настроенный выбор.
    #
    # Именно в нём лежит источник "поворот на 90 град, стоп, разворот обратно":
    #   <RoundRobin name="RecoveryActions">
    #     <Sequence>ClearLocalCostmap + ClearGlobalCostmap</Sequence>
    #     <Spin spin_dist="1.57"/>      <- 1.57 рад = 89.95 град
    #     <Wait wait_duration="5"/>     <- отсюда "останавливается"
    #     <BackUp backup_dist="0.30" backup_speed="0.05"/>
    #   </RoundRobin>
    # Чтобы поменять spin_dist, нужно своё дерево; правильнее не доводить до
    # восстановления — см. FollowPath.xy_goal_tolerance ниже.
    bt_loop_duration: 10
    default_server_timeout: 20
    # ВЫКЛЮЧЕНО 2026-07-27: ZMQ-паблишер Groot сериализует и шлёт состояние
    # дерева на КАЖДЫЙ тик (bt_loop_duration: 10 -> 100 Гц), независимо от того,
    # подключён ли кто-нибудь. На Orin это плата ни за что. Включать точечно,
    # когда реально садишься смотреть дерево.
    enable_groot_monitoring: False
    groot_zmq_publisher_port: 1666
    groot_zmq_server_port: 1667
    plugin_lib_names:
    - nav2_compute_path_to_pose_action_bt_node
    - nav2_compute_path_through_poses_action_bt_node
    - nav2_follow_path_action_bt_node
    - nav2_back_up_action_bt_node
    - nav2_spin_action_bt_node
    - nav2_wait_action_bt_node
    - nav2_clear_costmap_service_bt_node
    - nav2_is_stuck_condition_bt_node
    - nav2_goal_reached_condition_bt_node
    - nav2_goal_updated_condition_bt_node
    - nav2_initial_pose_received_condition_bt_node
    - nav2_reinitialize_global_localization_service_bt_node
    - nav2_rate_controller_bt_node
    - nav2_distance_controller_bt_node
    - nav2_speed_controller_bt_node
    - nav2_truncate_path_action_bt_node
    - nav2_goal_updater_node_bt_node
    - nav2_recovery_node_bt_node
    - nav2_pipeline_sequence_bt_node
    - nav2_round_robin_node_bt_node
    - nav2_transform_available_condition_bt_node
    - nav2_time_expired_condition_bt_node
    - nav2_distance_traveled_condition_bt_node
    - nav2_single_trigger_bt_node
    - nav2_is_battery_low_condition_bt_node
    - nav2_navigate_through_poses_action_bt_node
    - nav2_navigate_to_pose_action_bt_node
    - nav2_remove_passed_goals_action_bt_node
    - nav2_planner_selector_bt_node
    - nav2_controller_selector_bt_node
    - nav2_goal_checker_selector_bt_node

bt_navigator_rclcpp_node:
  ros__parameters:
    use_sim_time: False

controller_server:
  ros__parameters:
    use_sim_time: False
    # ПОДНЯТО 2026-07-27 с 10.0 вместе с удвоением скоростей: на 0.6 м/с цикл в
    # 10 Гц — это 6 см вслепую между решениями. 15 Гц возвращает шаг к прежним
    # ~4 см. Бюджет на это освобождён отключением voxel_layer в обоих костмапах
    # и debug_trajectory_details ниже — суммарно нагрузка должна упасть, а не
    # вырасти. Если Orin всё же не тянет — этот параметр крутить первым.
    controller_frequency: 15.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # Робот сперва доворачивается на месте (до ~6 с на 180 град при 0.5 рад/с),
      # и только потом едет — турлеботовские 0.5 м за 10 с этого не переживали.
      required_movement_radius: 0.25
      # ПОДНЯТО 2026-07-27 с 20.0. SimpleProgressChecker меряет ТОЛЬКО смещение
      # (hypot(dx, dy)) — доворот на месте для него всегда нулевой прогресс,
      # сколько бы робот ни крутился. Это и есть спусковой крючок восстановления
      # со Spin 1.57 рад. Реальную проблему чинит FollowPath.xy_goal_tolerance
      # ниже, а этот запас — второй ремень.
      # Если в вашем образе Humble есть nav2_controller::PoseProgressChecker —
      # он умеет required_movement_angle и снимает вопрос совсем; за его наличие
      # в конкретной сборке не ручаюсь, проверять до замены плагина.
      movement_time_allowance: 30.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25

    # DWB parameters
    FollowPath:
      # ─────────────────────────────────────────────────────────────────────
      # 2026-07-27: DWB завёрнут в RotationShimController.
      #
      # ПОЧЕМУ. DWB не умеет "сначала довернуться, потом ехать" — принципиально.
      # Он сэмплирует пары (vx, vtheta) и выбирает лучшую по сумме критиков;
      # пара с ненулевым vx и ненулевым vtheta — это дуга, и когда цель сбоку,
      # дуга почти всегда набирает больше очков, чем разворот на месте
      # (PathDist/GoalDist уменьшаются сразу, а не через 3 секунды). Отсюда
      # разворот с ходу по дуге вместо доворота на месте.
      #
      # ЧЕМ ЭТО ПЛОХО НА ЭТОМ РОБОТЕ. Дуга выносит корпус вбок, в сектор,
      # который лидары в этот момент не просматривают, а локальный костмап
      # НЕ отслеживает неизвестное пространство (track_unknown_space по
      # умолчанию false для rolling window) — то есть невиденная клетка для
      # него не "неизвестно", а "свободно". Доворот на месте укладывается в
      # robot_radius 0.43 и такого выноса не даёт.
      #
      # ЧТО ДЕЛАЕТ ШИМ. Это обёртка, а не замена: на каждый новый план он
      # смотрит на точку в forward_sampling_distance по маршруту, и если она
      # больше чем на angular_dist_threshold в стороне — крутит РОВНО на месте
      # (linear_vel = 0.0), пока не довернёт, и только потом отдаёт управление
      # DWB. Вся настройка DWB ниже остаётся в силе без изменений: шим грузит
      # его как primary_controller в этом же namespace.
      #
      # Заодно уходит выбор направления "в другую сторону": шим берёт
      # atan2(y, x) до точки маршрута, а это уже нормализовано в [-pi, pi],
      # то есть кратчайший разворот по построению.
      #
      # ТРЕБУЕТ пакет nav2_rotation_shim_controller в контейнере (входит в
      # метапакет navigation2). Проверить до выезда:
      #   ros2 pkg prefix nav2_rotation_shim_controller
      # Откатиться на прежнее поведение = вернуть plugin на dwb_core и удалить
      # шесть параметров шима. Больше ничего трогать не нужно.
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "dwb_core::DWBLocalPlanner"
      # 0.5 рад = 28.6 град. Ниже дефолтных 0.785 (45 град) — доворот на месте
      # хочется видеть чаще, а не только на резких поворотах. Сильно ниже
      # опускать не стоит: шим перепроверяется на КАЖДЫЙ новый план (дерево
      # реплэнит раз в секунду), и если порог опустится до типичной ошибки
      # слежения DWB, робот начнёт дёргаться между "кручусь" и "еду".
      angular_dist_threshold: 0.5
      # Точка на маршруте, на которую наводимся. Обязана быть больше
      # robot_radius (0.43), иначе целимся внутрь собственного корпуса.
      forward_sampling_distance: 0.6
      # ОБА параметра ниже дефолтные значения имеют ВЫШЕ наших лимитов
      # (1.8 рад/с и 3.2 рад/с^2 против 1.0472 и 2.0) — шим крутит своей
      # собственной командой в обход DWB, так что оставить дефолт означало бы
      # пробить лимитер базы именно на довороте.
      rotate_to_heading_angular_vel: 1.0
      max_angular_accel: 2.0
      # На сколько вперёд проверять столкновение во время доворота на месте.
      simulate_ahead_time: 1.0
      # ВЫКЛЮЧЕНО 2026-07-27: с этим флагом DWB каждый цикл сериализует и
      # публикует в /evaluation полную оценку ВСЕХ траекторий
      # (vx_samples * vtheta_samples = 400 штук) со всеми промежуточными позами
      # и всеми оценками критиков. Никто это не читал. Включать точечно при
      # разборе "почему выбралась эта траектория".
      debug_trajectory_details: False
      # Пределы обязаны совпадать с лимитером diff_drive_controller
      # (guide_robot_controllers.yaml), иначе DWB строит траектории, которых
      # база не исполняет. Раньше тут стояли турлеботовские 0.22/1.0 и acc 2.5.
      # УДВОЕНО 2026-07-27 вслед за базой. Небольшой запас до лимитера базы
      # (0.5 против 0.6, 1.0 против 1.0472) оставлен намеренно и в той же
      # пропорции, что была раньше: планировать надо строго внутри исполнимого.
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.5
      max_vel_y: 0.0
      max_vel_theta: 1.0
      min_speed_xy: 0.0
      max_speed_xy: 0.5
      min_speed_theta: 0.0
      acc_lim_x: 0.6
      acc_lim_y: 0.0
      acc_lim_theta: 2.0
      decel_lim_x: -1.0
      decel_lim_y: 0.0
      decel_lim_theta: -4.0
      vx_samples: 20
      vy_samples: 0
      vtheta_samples: 40
      sim_time: 2.0
      linear_granularity: 0.05
      # ПОДНЯТО 2026-07-27 с 0.025 вслед за удвоением max_vel_theta. Гранулярность
      # задаёт ШАГ дискретизации траектории, а не её длину: при 1.0 рад/с и
      # sim_time 2.0 траектория заметает 2.0 рад, и на шаге 0.025 это 80 поз
      # против прежних 40. Стоимость цикла удвоилась бы на ровном месте.
      # 0.05 рад = 2.9 град — всё ещё мельче клетки костмапа на любом плече.
      angular_granularity: 0.05
      transform_tolerance: 0.2
      # ИСПРАВЛЕНО 2026-07-27: было 0.05 против 0.25 у general_goal_checker.
      # Это и есть корень "приехал, дёргается, уходит в восстановление".
      # Критик RotateToGoal — ЕДИНСТВЕННОЕ, что заставляет DWB доворачиваться на
      # месте в конце, — включается по ЭТОМУ допуску, а не по допуску goal
      # checker-а. Робот вставал в 0.1-0.2 м от цели: goal checker недоволен
      # (yaw мимо), RotateToGoal ещё не активен. Оставались только сеточные
      # критики PathAlign/GoalAlign/PathDist/GoalDist, которые меряют расстояния
      # по клеткам костмапа от точки в 0.1 м впереди робота, — на развороте
      # ровно на 180 град это почти симметрично, градиента нет, направление
      # выбирал шум квантования. Дальше SimpleProgressChecker (смещение = 0)
      # выбивал таймаут и запускал Spin 1.57.
      # ДЕРЖАТЬ РАВНЫМ general_goal_checker.xy_goal_tolerance. В стоке nav2 они
      # равны, и не случайно.
      xy_goal_tolerance: 0.25
      # Должно быть СИЛЬНО ниже max_vel_x: критик RotateToGoal считает робота
      # остановившимся ниже этого порога. Турлеботовские 0.25 равнялись
      # max_vel_x, то есть робот числился стоящим на любой скорости.
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: False

local_costmap:
  local_costmap:
    ros__parameters:
      # ПОДНЯТО 2026-07-27 с 5.0: контроллер теперь крутится на 15 Гц, и при
      # 5 Гц он в двух циклах из трёх решал по устаревшей карте препятствий.
      # На 0.6 м/с 200 мс задержки — это 12 см. publish_frequency оставлен 2.0:
      # он влияет только на картинку в RViz, не на планирование.
      update_frequency: 10.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: False
      rolling_window: true
      # РАСШИРЕНО 2026-07-27 с 3x3 вслед за скоростью. DWB симулирует sim_time
      # 2.0 с на max_vel_x 0.5 = 1.0 м вперёд, а окно 3x3 даёт всего 1.5 м от
      # робота до края — траектории упирались бы в границу карты и оценивались
      # по обрезанным данным. 5x5 = 100x100 клеток, для Orin это ничто.
      width: 5
      height: 5
      resolution: 0.05
      # Корпус в URDF: цилиндр r=0.31 с центром в x=-0.12 от base_link -> 0.43.
      robot_radius: 0.43
      # voxel_layer УБРАН 2026-07-27. Он растеризовал ТОТ ЖЕ САМЫЙ /scan, что и
      # obstacle_layer рядом — двойная работа на каждом апдейте, ради ровно тех
      # же клеток. Воксельная сетка имеет смысл для 3D-источника (глубинная
      # камера, облако); у нас планарный лидар, вся информация в одной плоскости.
      # Плюс publish_voxel_map: True постоянно публиковал воксельное облако,
      # которое никто не подписывал.
      plugins: ["obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # СВЕДЕНО 2026-07-27: было 1.0 здесь против 0.55 в global_costmap.
        # Расхождение означало, что глобальный планировщик считал проход дешёвым,
        # а локальный костмап на том же месте видел высокую цену и уводил робота
        # с собственного плана. Оба слоя обязаны раздувать одинаково.
        # ВОЗВРАЩЕНО на 1.0 (2026-07-27, второй заход). Сводя два слоя, я увёл
        # локальный радиус с 1.0 на 0.75 — то есть уменьшил запас до препятствий
        # ровно в том прогоне, где робот стал их задевать. Сведение слоёв было
        # правильным, выбор общего значения — нет. Общее значение = 1.0, то,
        # с которым локальный костмап работал раньше.
        # Цена: при 1.0 и robot_radius 0.43 проход уже ~2.0 м раздувается
        # целиком, градиент внутри него плоский и робот перестаёт сам держаться
        # середины. Если в лаборатории такие проходы есть — снижать ОБА слоя
        # разом, до 0.8, но не врозь.
        inflation_radius: 1.0
        cost_scaling_factor: 3.0
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          # Явные дальности перенесены сюда из удалённого voxel_layer, чтобы
          # удаление слоя ничего не поменяло по существу. Подняты под окно 5x5:
          # raytrace должен доставать до угла (2.5*sqrt(2) = 3.54), иначе
          # уехавшие препятствия не вычищаются с краёв карты.
          raytrace_max_range: 3.6
          raytrace_min_range: 0.0
          obstacle_max_range: 3.0
          obstacle_min_range: 0.0
      # УБРАН 2026-07-27 блок static_layer: его не было в plugins, то есть слой
      # не создавался и настройка лежала мёртвым грузом. Локальному костмапу
      # статический слой и не нужен — он rolling_window в кадре odom.
      always_send_full_costmap: True
  local_costmap_client:
    ros__parameters:
      use_sim_time: False
  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: False

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      # ИСПРАВЛЕНО 2026-07-27: было True — единственное True среди всех блоков
      # этого файла. Сейчас безвредно: navigation_launch.py в Humble гоняет
      # параметры через RewrittenYaml с param_substitutions {'use_sim_time': ...}
      # и перетирает значение аргументом запуска. Но в Jazzy эту подстановку
      # выкинули, и там нода честно ушла бы на симуляционные часы, которых на
      # роботе нет: clock застыл бы на нуле, а с ним весь костмап.
      use_sim_time: False
      robot_radius: 0.43
      resolution: 0.05
      track_unknown_space: true
      # voxel_layer УБРАН 2026-07-27 — см. подробное обоснование в local_costmap.
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        # СВЕДЕНО 2026-07-27 с local_costmap (было 0.55 здесь против 1.0 там).
        inflation_radius: 1.0
      # ВЫКЛЮЧЕНО 2026-07-27. Глобальный костмап — это вся лаборатория,
      # 560x482 клеток = 270 КБ на сообщение. При True это уходило целиком
      # каждую секунду каждому подписчику (RViz, Foxglove) вместо инкрементов
      # в costmap_updates. Дисплеи в view_robot.rviz на update-топики подписаны.
      always_send_full_costmap: False
  global_costmap_client:
    ros__parameters:
      use_sim_time: False
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: False

map_server:
  ros__parameters:
    use_sim_time: False
    # Значение-заглушка: localization_launch.py подменяет yaml_filename путём из
    # аргумента map: (hardware.launch.py, по умолчанию map/lab_map.yaml).
    # Правится ТАМ, а не здесь.
    yaml_filename: "map.yaml"

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    # ИСПРАВЛЕНО 2026-07-27 с 20.0. Это не "как часто планировать", а "как часто
    # я ОЖИДАЮ, что меня позовут" — планировщик сравнивает с фактом и на каждом
    # несовпадении пишет в лог "Planner loop missed its desired rate".
    # Зовёт его дерево поведения через <RateController hz="1.0">, то есть раз в
    # секунду. Ожидание 20 Гц против факта 1 Гц = предупреждение каждый цикл,
    # ровно то, что тонет в логах и потом мешает увидеть настоящую проблему.
    expected_planner_frequency: 1.0
    use_sim_time: False
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time: False

# Нода называется behavior_server начиная с Galactic; блок recoveries_server
# просто не читался, и сервер работал на дефолтах (в т.ч. вращение 1.0 рад/с
# против физических 0.5236).
behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_timeout: 0.1
    # ИСПРАВЛЕНО 2026-07-27: было true — та же история, что в global_costmap.
    use_sim_time: False
    simulate_ahead_time: 2.0
    # УДВОЕНО 2026-07-27 вслед за базой. Именно этот сервер исполняет Spin и
    # BackUp из ветки восстановления, так что его потолок тоже обязан
    # соответствовать лимитеру, иначе восстановление будет ползти.
    # min_rotational_vel намеренно НЕ удваивается: это нижний порог, чтобы
    # довернуть последние градусы, а не скорость движения.
    max_rotational_vel: 1.0
    min_rotational_vel: 0.2
    rotational_acc_lim: 2.0

robot_state_publisher:
  ros__parameters:
    use_sim_time: False

# navigation_launch.py (Humble) поднимает velocity_smoother и ставит его ПОСЛЕДНИМ
# в цепочке до колёс: controller_server -> cmd_vel_nav -> velocity_smoother ->
# cmd_vel_smoothed -> cmd_vel. Без своей секции он работал на дефолтах
# (max_velocity [0.5, 0.0, 2.5], max_accel [2.5, 0.0, 3.2]), то есть последняя
# ступень была втрое-впятеро шире всего, что настроено ниже по стеку, и реально
# ограничивал только лимитер diff_drive_controller.
# Значения обязаны совпадать с guide_robot_controllers.yaml.
velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    # УДВОЕНО 2026-07-27. Третье место, где живут одни и те же числа
    # (guide_robot_controllers.yaml и FollowPath выше) — менять всегда тройкой.
    max_velocity: [0.6, 0.0, 1.0472]
    min_velocity: [-0.6, 0.0, -1.0472]
    max_accel: [0.6, 0.0, 2.0]
    max_decel: [-1.0, 0.0, -4.0]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

waypoint_follower:
  ros__parameters:
    # СНИЖЕНО 2026-07-27 с 200. Это частота опроса результата текущей цели,
    # а не что-то, влияющее на плавность движения: 200 Гц просто жгли ядро
    # впустую. 20 Гц — дефолт nav2.
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

collision_monitor:
  ros__parameters:
    use_sim_time: False
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel"
    cmd_vel_out_topic: "/diff_drive_controller/cmd_vel_unstamped"
    transform_tolerance: 0.5
    source_timeout: 0.5
    base_shift_correction: True
    stop_pub_timeout: 2.0

    polygons: ["FootprintApproach", "SonarStopFront", "SonarSlow"]

    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 1.5
      simulation_time_step: 0.1
      max_points: 5
      visualize: False
      enabled: True

    SonarStopFront:
      type: "polygon"
      action_type: "stop"
      points: [0.35, 0.28, 0.35, -0.28, -0.05, -0.28, -0.05, 0.28]
      max_points: 1
      visualize: True
      polygon_pub_topic: "sonar_stop_polygon"
      enabled: True

    SonarSlow:
      type: "polygon"
      action_type: "slowdown"
      slowdown_ratio: 0.4
      points: [0.55, 0.34, 0.55, -0.34, -0.10, -0.34, -0.10, 0.34]
      max_points: 1
      visualize: True
      polygon_pub_topic: "sonar_slow_polygon"
      enabled: True

    observation_sources: ["scan", "sonar_1", "sonar_9", "sonar_2",
                          "sonar_8", "sonar_4", "sonar_6", "sonar_5"]

    scan:
      type: "scan"
      topic: "/scan"
      enabled: True

    sonar_1:
      type: "range"
      topic: "/sonar/range/sonar_sensor_1"
      enabled: True
    sonar_9:
      type: "range"
      topic: "/sonar/range/sonar_sensor_9"
      enabled: True
    sonar_2:
      type: "range"
      topic: "/sonar/range/sonar_sensor_2"
      enabled: True
    sonar_8:
      type: "range"
      topic: "/sonar/range/sonar_sensor_8"
      enabled: True
    sonar_4:
      type: "range"
      topic: "/sonar/range/sonar_sensor_4"
      enabled: True
    sonar_6:
      type: "range"
      topic: "/sonar/range/sonar_sensor_6"
      enabled: True
    sonar_5:
      type: "range"
      topic: "/sonar/range/sonar_sensor_5"
      enabled: True