# Геометрия выражений лица (CLAUDE_CODE_TASK_face_stage1.md §2.2).
#
# Параметры пере-авторятся и версионируются здесь же, как семантическая
# карта -- код (face.js) только линейно интерполирует между значениями.
# Добавление состояния не должно требовать правки JS.
#
# Система координат -- условное "пространство глаз" view_w x view_h,
# SVG растягивается на весь экран через viewBox + CSS (независимо от
# реального разрешения панели, см. §0.1 -- разрешение не подтверждено).

global:
  view_w: 1000
  view_h: 600
  eye_cx_left: 320
  eye_cx_right: 680
  cy: 300
  eye_color: "#eaf6ff"
  bg_color: "#05070a"
  blink_interval_min_s: 2.5
  blink_interval_max_s: 6.0
  blink_duration_ms: 140

# w, h        -- размер тела глаза, px
# rr          -- радиус скругления углов, px
# rot         -- поворот, градусы; на правом глазу зеркалится (-rot)
# curve       -- подъём нижнего века, 0..1 (0 = прямое веко, 1 = максимальный полумесяц)
# gx, gy      -- смещение взгляда относительно eye_cx/cy, px (складывается с gaze_az)
states:
  idle:
    w: 130
    h: 170
    rr: 40
    rot: 0
    curve: 0.0
    gx: 0
    gy: 0

  listening:
    w: 140
    h: 185
    rr: 45
    rot: 0
    curve: 0.0
    gx: 0
    gy: -6

  thinking:
    w: 110
    h: 130
    rr: 30
    rot: 8
    curve: 0.35
    gx: 18
    gy: -10

  speaking:
    w: 135
    h: 175
    rr: 42
    rot: 0
    curve: 0.1
    gx: 0
    gy: 0

  driving:
    w: 125
    h: 150
    rr: 35
    rot: 0
    curve: 0.15
    gx: 0
    gy: 8

  sleep:
    w: 130
    h: 40
    rr: 20
    rot: 0
    curve: 0.9
    gx: 0
    gy: 0

  error:
    w: 115
    h: 150
    rr: 20
    rot: -12
    curve: 0.25
    gx: 0
    gy: 0
