<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>guide_robot_face</title>
    <link rel="stylesheet" href="/face.css" />
  </head>
  <body>
    <svg id="face" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
      <rect id="bg" x="0" y="0" width="100%" height="100%"></rect>
      <g id="eye-left" class="eye">
        <rect class="body"></rect>
        <text class="err-label" text-anchor="middle" dominant-baseline="central" x="0" y="0"></text>
        <path class="lid-bottom"></path>
        <rect class="lid-top"></rect>
        <path class="halo" fill-rule="evenodd"></path>
      </g>
      <g id="eye-right" class="eye">
        <rect class="body"></rect>
        <text class="err-label" text-anchor="middle" dominant-baseline="central" x="0" y="0"></text>
        <path class="lid-bottom"></path>
        <rect class="lid-top"></rect>
        <path class="halo" fill-rule="evenodd"></path>
      </g>
    </svg>
    <script src="/face.js"></script>
  </body>
</html>
