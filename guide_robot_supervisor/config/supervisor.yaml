supervisor:
  # ---------------------------------------------------------------- groups --
  # Order in this list = bring-up order. Shutdown happens in reverse.
  # Every lifecycle_manager referenced here MUST have autostart: false.
  groups:
    - name: safety
      manager: /lifecycle_manager_safety
      preconditions: [sonar_rate, scan_rate]
      precondition_timeout: 60.0
      startup_timeout: 30.0

    - name: localization
      manager: /lifecycle_manager_localization
      requires: [safety]
      preconditions: [tf_odom]
      startup_timeout: 30.0

    # keepout-зоны (Nav2 costmap filters) -- filter_mask_server +
    # costmap_filter_info_server, запускаются guide_robot_navigation/launch/
    # navigation.launch.py только когда keepout_mask_file непуст (сейчас --
    # только для карты симуляции innopark_l_10.09_edited, на hardware/
    # lab_105_full маски ещё нет, поэтому optional: узлов может не быть вовсе).
    - name: costmap_filters
      manager: /lifecycle_manager_costmap_filters
      requires: [safety]
      startup_timeout: 15.0
      optional: true

    # voice до navigation: кастомный BT зовёт /say на activate.
    # Без tts_node bt_navigator падает с "Action server say not available".
    - name: voice
      manager: /lifecycle_manager_voice
      startup_timeout: 30.0
      optional: true

    - name: navigation
      manager: /lifecycle_manager_navigation
      # requires: voice -- ждём, пока tts_node активен, прежде чем
      # активировать bt_navigator (см. комментарий выше). costmap_filters
      # НЕ в requires намеренно: это optional-группа (узлов может не быть
      # вовсе, если для текущей карты нет keepout-маски), а _bringup() в
      # supervisor_node.py -- один синхронный проход: FAILED-состояние
      # optional-группы не считается "requires удовлетворён", и весь bring-up
      # уйдёт в FAULT для КАЖДОЙ не-optional группы, которая её потребует
      # (живой баг, если добавить). Costmap-фильтр не нуждается в жёстком
      # порядке -- KeepoutFilter просто ждёт данные на топике, активация
      # костмапов не блокируется их отсутствием.
      requires: [localization, voice]
      preconditions: [tf_map]
      startup_timeout: 45.0

    - name: semantic_map
      manager: /lifecycle_manager_semantic_map
      startup_timeout: 30.0
      optional: true

    - name: mission
      manager: /lifecycle_manager_mission
      # narration_server (mission_container) зовёт Say (voice) и
      # ~/get_exhibit_content (semantic_map) -- должны быть подняты раньше.
      requires: [navigation, voice, semantic_map]
      startup_timeout: 30.0
      optional: true

    # dialog_agent на activate тянет каталог через location_server --
    # раньше semantic_map нельзя (живой баг: autostart LLM в hardware
    # падал с «location_server недоступен», пока supervisor ещё крутил nav).
    - name: llm
      manager: /lifecycle_manager_llm
      requires: [semantic_map]
      startup_timeout: 45.0
      optional: true

  # ------------------------------------------------------------- watchdogs --
  # Referenced from `preconditions` above (gate bring-up) and evaluated
  # continuously afterwards according to `policy`.
  watchdogs:
    - name: sonar_rate
      class: guide_robot_supervisor.watchdogs.topic_rate.TopicRateWatchdog
      params:
        topics:
          - /sonar/range/sonar_sensor_1
          - /sonar/range/sonar_sensor_2
          - /sonar/range/sonar_sensor_4
          - /sonar/range/sonar_sensor_5
          - /sonar/range/sonar_sensor_6
          - /sonar/range/sonar_sensor_8
          - /sonar/range/sonar_sensor_9
        msg_type: sensor_msgs/msg/Range
        qos: sensor           # BEST_EFFORT — must match sonar_node
        min_rate: 1.5         # ~250 ms UART round robin -> ~4 Hz nominal
        warn_rate: 3.0
        grace: 20.0
      policy:
        on_error: pause       # blind robot -> freeze navigation, keep it alive
        target: navigation
        debounce: 3
        period: 1.0

    - name: scan_rate
      class: guide_robot_supervisor.watchdogs.topic_rate.TopicRateWatchdog
      params:
        topics: [/scan, /scan_left, /scan_right]
        msg_type: sensor_msgs/msg/LaserScan
        qos: sensor
        min_rate: 5.0
        warn_rate: 8.0
        grace: 20.0
      policy:
        on_error: pause
        target: navigation
        debounce: 3
        period: 1.0

    # TFRawWatchdog вместо TFWatchdog: tf2 TransformListener разбирал каждое
    # сообщение /tf (~75 Гц) в питоновские объекты ради двух штампов --
    # основной расход CPU супервизора. Сырой проверяет только прямое ребро,
    # поэтому child = base_footprint (его публикует diff_drive,
    # controllers.yaml.in base_frame_id), base_link к нему прибит статикой.
    - name: tf_odom
      class: guide_robot_supervisor.watchdogs.tf_raw.TFRawWatchdog
      # 1.0 с ловило scheduling hitch (ros2 CLI / шторм /rosout) как
      # пропажу одометрии и вешало estop. pause navigation, не вся база.
      params: {parent: odom, child: base_footprint, max_age: 3.0, grace: 20.0}
      policy: {on_error: pause, target: navigation, debounce: 3, period: 0.5}

    - name: tf_map
      class: guide_robot_supervisor.watchdogs.tf_raw.TFRawWatchdog
      params: {parent: map, child: odom, max_age: 5.0, grace: 30.0}
      policy: {on_error: pause, target: navigation, debounce: 5, period: 1.0}

    - name: control_stack
      class: guide_robot_supervisor.watchdogs.node_alive.NodeAliveWatchdog
      params:
        nodes: [/controller_manager, /diff_drive_controller, /robot_state_publisher]
        grace: 20.0
      policy: {on_error: shutdown, debounce: 3, period: 1.0}

    - name: safety_alive
      class: guide_robot_supervisor.watchdogs.node_alive.LifecycleManagerActiveWatchdog
      params: {manager: /lifecycle_manager_safety, timeout: 2.0}
      policy: {on_error: pause, target: navigation, debounce: 2, period: 2.0}
