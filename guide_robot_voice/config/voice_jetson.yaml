# Оверлей железа: USB Fifine (ALSA "USB PnP Audio Device") + JBL Go 2 через Pulse.
#
# jetson_audio.sh держит BT как default sink; мик в Pulse = off,
# иначе Pulse держит hw: и ROS не откроет карту. Захват -- имя карты, не pulse.
# gate_on_tts: без AEC иначе робот слышит себя и рвёт фразу на одно слово.

/**/audio_frontend:
  ros__parameters:
    device: "USB PnP Audio Device"
    device_rate: 48000             # этот CM108/JMTek отдаёт только 48 kHz
    out_rate: 16000
    frame_ms: 16
    channels_in: 1                 # Pulse/ALSA: mono-fallback
    periods: 16                    # больше буфер ALSA: overflow важнее, чем +100 мс к ASR
    gain_db: 0.0                   # у Fifine свой крутилёк громкости
    hpf_hz: 40.0
    publish_raw: false
    aec:
      enabled: false
      backend: "none"
      filter_length_ms: 200.0

/**/vad_node:
  ros__parameters:
    model_path: "$(find-pkg-share guide_robot_voice)/models/silero_vad.onnx"
    enter_threshold: 0.50
    exit_threshold: 0.20
    enter_windows: 1
    # 600/600: компромисс после замера latency (decode/LLM доминируют, не
    # endpoint). 400/400 экономило ~0.5 с, но резало паузы; 700/600 -- старое.
    hangover_ms: 600.0
    min_speech_ms: 120.0
    barge_in_enabled: true
    barge_in_min_windows: 2
    # true: без AEC колонка в мик = VAD CancelAll, робот рвёт сам себя.
    # Interrupt голосом во время TTS -- только «робот»/«стоп» (wakeword);
    # VAD barge-in после AEC.
    require_aec_for_barge_in: true

/**/asr_node:
  ros__parameters:
    model_path: "$(find-pkg-share guide_robot_voice)/models/gigaam_v3_ctc_int8.onnx"
    tokens_path: "$(find-pkg-share guide_robot_voice)/models/gigaam_v3_ctc_tokens.txt"
    num_threads: 2
    pre_roll_ms: 300.0
    partial_rate_hz: 2.0           # 6 Гц * 5 с окна на CUDA рядом с LLM = executor голодал /audio/mic
    partial_window_s: 2.0
    base_silence_ms: 600.0
    short_silence_ms: 350.0
    max_utterance_s: 20.0
    short_path_max_ms: 0.0
    min_final_chars: 2
    gate_on_tts: true
    # Партиалы во время TTS → wakeword («робот»/«стоп»), без финалов в диалог.
    # VAD barge-in выключен (require_aec); иначе колонка рвёт речь сама.
    wakeword_listen_during_tts: true

/**/wakeword_node:
  ros__parameters:
    backend: "asr_kws"
    activation_phrases: ["робот", "слушай робот"]
    stop_phrases: ["стоп", "стой", "хватит", "замолчи"]
    fuzzy_max_distance: 1
    min_confidence: 0.5
    refractory_ms: 1500.0

/**/tts_node:
  ros__parameters:
    backend: silero
    model_path: "$(find-pkg-share guide_robot_voice)/models/v5_ru.pt"
    speaker: xenia
    speaker_id: 0
    length_scale: 1.0
    device: "pulse"
    device_rate: 48000
    allow_shared: true
    block_ms: 20
    periods: 8
    fade_out_ms: 80              # мягкое затухание при «робот»/стоп; estop -- сразу
    max_clause_chars: 180
    max_queue: 8
    heartbeat_hz: 5.0
    warmup_text: "Система готова"
    default_priority: 50
