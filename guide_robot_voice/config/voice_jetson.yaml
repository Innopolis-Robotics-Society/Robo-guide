# Оверлей железа: USB Razer Seiren X на захват, Bluetooth колонка через Pulse.
#
# jetson_audio.sh держит BT как default sink; Razer в Pulse = off
# (иначе output-профиль ворует колонку). Захват -- имя карты, не pulse.
# gate_on_tts: без AEC иначе робот слышит себя и рвёт фразу на одно слово.

/**/audio_frontend:
  ros__parameters:
    device: "Razer Seiren X"
    device_rate: 16000
    out_rate: 16000
    frame_ms: 16
    channels_in: 2                 # Seiren X: ALSA hw только stereo, downmix в ноде
    periods: 16                    # больше буфер ALSA: overflow важнее, чем +100 мс к ASR
    gain_db: 9.0
    hpf_hz: 40.0
    publish_raw: false
    aec:
      enabled: false
      backend: "none"
      filter_length_ms: 200.0

/**/vad_node:
  ros__parameters:
    model_path: "$(find-pkg-share guide_robot_voice)/models/silero_vad.onnx"
    enter_threshold: 0.50
    exit_threshold: 0.20
    enter_windows: 1
    hangover_ms: 700.0
    min_speech_ms: 120.0
    barge_in_enabled: true
    barge_in_min_windows: 2
    require_aec_for_barge_in: true   # нет AEC -- иначе TTS с колонки рвёт сам себя

/**/asr_node:
  ros__parameters:
    model_path: "$(find-pkg-share guide_robot_voice)/models/gigaam_v3_ctc_int8.onnx"
    tokens_path: "$(find-pkg-share guide_robot_voice)/models/gigaam_v3_ctc_tokens.txt"
    num_threads: 2
    pre_roll_ms: 300.0
    partial_rate_hz: 6.0
    partial_window_s: 5.0
    base_silence_ms: 600.0
    short_silence_ms: 350.0
    max_utterance_s: 20.0
    short_path_max_ms: 0.0
    min_final_chars: 2
    gate_on_tts: true

/**/wakeword_node:
  ros__parameters:
    backend: "asr_kws"
    activation_phrases: ["робот", "слушай робот"]
    stop_phrases: ["стоп", "стой", "хватит", "замолчи"]
    fuzzy_max_distance: 1
    min_confidence: 0.5
    refractory_ms: 1500.0

/**/tts_node:
  ros__parameters:
    backend: piper
    model_path: "$(find-pkg-share guide_robot_voice)/models/ru_RU-irina-medium.onnx"
    speaker_id: 0
    length_scale: 1.0
    device: "pulse"
    device_rate: 48000
    allow_shared: true
    block_ms: 20
    periods: 8
    max_clause_chars: 180
    max_queue: 8
    heartbeat_hz: 5.0
    warmup_text: "Система готова"
    default_priority: 50
