# Оверлей для разработки на проводной USB-гарнитуре.
#
# Наушники физически разрывают тракт динамик -> микрофон. Это значит,
# что AEC не "отложен на потом", его в этой конфигурации просто нет
# как задачи (design §7, Stage 1). Всё остальное -- контракт, fencing,
# приоритеты, barge-in, ASR, просодия чанкера -- проверяется полностью
# и по-настоящему.
#
# На этом конкретном USB-микрофоне (WJK USB Audio, hw:2,0) акустической
# связи нет ещё надёжнее, чем "просто наушники": устройство физически
# capture-only (0 каналов вывода) -- см. `python3 -c "import sounddevice;
# print(sounddevice.query_devices())"`. Воспроизведение идёт через
# отдельное устройство (аналоговый выход ноутбука, hw:1,0), с которым
# у микрофона нет ни общего корпуса, ни общей платы АЦП.
#
# ЛОВУШКА, актуальная для БУДУЩЕГО USB-headset'а, где вход и выход --
# одно устройство: device у tts_node должен указывать на ту же гарнитуру,
# что и микрофон в audio_frontend, иначе VAD услышит собственный голос
# робота через микрофон и barge-in уйдёт в самоподдерживающийся цикл.
# Здесь это неприменимо (устройства физически разные), но при переезде
# на комбинированную гарнитуру -- первое, что проверять.

/**/tts_node:
  ros__parameters:
    backend: piper
    # Модель лежит в репозитории (models/, git-lfs), путь одинаков везде.
    model_path: "$(find-pkg-share guide_robot_voice)/models/ru_RU-irina-medium.onnx"
    device: "hw:1,0"    # аналоговый выход ноутбука -- ЗАМЕНИТЬ под своё железо
    device_rate: 48000
    block_ms: 20
    # ИЗМЕРИТЬ ЗДЕСЬ. Это реальное ALSA-устройство, а не заглушка, поэтому
    # t_stop меряется по-настоящему уже сейчас. Если измеренный t_stop
    # сильно превышает periods*block_ms, значит abort() не доходит до
    # snd_pcm_drop и звуковой сервер держит собственный буфер -- это
    # архитектурная находка, а не подстройка параметра.
    periods: 3
    max_clause_chars: 180
    max_queue: 8
    heartbeat_hz: 5.0
    warmup_text: "Система готова"
    default_priority: 50

/**/audio_frontend:
  ros__parameters:
    device: "hw:2,0"    # WJK USB Audio -- ЗАМЕНИТЬ под своё железо
    device_rate: 48000
    out_rate: 16000
    frame_ms: 16
    channels_in: 1
    periods: 3
    gain_db: 0.0
    hpf_hz: 40.0
    # На гарнитуре включаем: диагностический дубль на device_rate удобен
    # при подборе hpf_hz/gain_db -- сравнить обработанный /audio/mic
    # с сырым /audio/mic_raw можно прямо по `ros2 topic echo`.
    publish_raw: true
    aec:
      enabled: false
      backend: "none"
      filter_length_ms: 200.0
