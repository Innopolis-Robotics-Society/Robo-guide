# Параметры голосового стека.
#
# Значения, помеченные ИЗМЕРИТЬ, нельзя оставлять как есть после приезда
# железа: они подобраны из общих соображений и обязаны быть заменены
# результатом измерения на роботе. См. voice_headset.yaml -- оверлей для
# разработки на гарнитуре, где device обязан быть переопределён.

/**/audio_frontend:
  ros__parameters:
    device: ""                    # пусто -> устройство по умолчанию
    device_rate: 48000
    out_rate: 16000
    frame_ms: 16                   # фиксировано: 512=2 кадра Silero, 1280=5 кадров oWW
    channels_in: 1
    periods: 3                    # 48 мс буфера захвата
    gain_db: 0.0
    hpf_hz: 40.0
    publish_raw: false            # диагностический дубль на device_rate
    aec:
      enabled: false               # Stage 2+
      backend: "none"              # none | speexdsp | webrtc | hardware
      filter_length_ms: 200.0

/**/vad_node:
  ros__parameters:
    model_path: "$(find-pkg-share guide_robot_voice)/models/silero_vad.onnx"
    enter_threshold: 0.65
    exit_threshold: 0.35
    enter_windows: 2               # 64 мс подтверждения
    hangover_ms: 400.0
    min_speech_ms: 120.0           # короче -> не высказывание, а хлопок
    barge_in_enabled: true
    barge_in_min_windows: 2
    require_aec_for_barge_in: false   # -> true на Stage 3

/**/asr_node:
  ros__parameters:
    # GigaAM v3 CTC INT8 в репозитории (models/, git-lfs). Онлайн-инференс
    # (sherpa_onnx.OnlineRecognizer) недоступен -- экспорт для sherpa-onnx
    # не несёт метаданных cache-aware streaming (см. lib/asr_model.py).
    # Партиалы поэтому считаются на скользящем окне (partial_window_s),
    # а не потоково -- это отклонение от design §3.4, не опечатка.
    model_path: "$(find-pkg-share guide_robot_voice)/models/gigaam_v3_ctc_int8.onnx"
    tokens_path: "$(find-pkg-share guide_robot_voice)/models/gigaam_v3_ctc_tokens.txt"
    num_threads: 2
    pre_roll_ms: 300.0              # без него срезается первый слог
    partial_rate_hz: 6.0
    partial_window_s: 5.0           # НЕ из design -- см. комментарий выше
    base_silence_ms: 600.0
    short_silence_ms: 350.0
    max_utterance_s: 20.0           # страховка
    min_final_chars: 2
    gate_on_tts: false              # true -> не слушать во время речи робота

/**/wakeword_node:
  ros__parameters:
    backend: "asr_kws"              # asr_kws (Stage 1) | oww (Stage 3, не реализован)
    activation_phrases: ["робот", "слушай робот"]
    stop_phrases: ["стоп", "стой", "хватит", "замолчи"]
    fuzzy_max_distance: 1
    min_confidence: 0.5
    refractory_ms: 1500.0            # анти-дребезг, одно срабатывание на фразу

/**/tts_node:
  ros__parameters:
    backend: piper                # piper | null (null -> тон, режим измерений)
    # Модель лежит в репозитории (models/, git-lfs) -- путь одинаков на любой
    # машине, ничего не нужно скачивать отдельно.
    model_path: "$(find-pkg-share guide_robot_voice)/models/ru_RU-irina-medium.onnx"
    speaker_id: 0
    length_scale: 1.0
    device: ""                    # пусто -> устройство по умолчанию
    device_rate: 48000
    block_ms: 20                  # верхняя граница остатка при отмене
    periods: 3                    # 60 мс буфера воспроизведения, ИЗМЕРИТЬ
    max_clause_chars: 180
    max_queue: 8
    heartbeat_hz: 5.0
    warmup_text: "Система готова"
    default_priority: 50
