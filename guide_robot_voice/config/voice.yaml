# Параметры голосового стека.
#
# Значения, помеченные ИЗМЕРИТЬ, нельзя оставлять как есть после приезда
# железа: они подобраны из общих соображений и обязаны быть заменены
# результатом измерения на роботе.

/**/audio_frontend:
  ros__parameters:
    source: device                # device | file
    device_name: "XVF3800"        # подстрока имени, не индекс и не default
    sample_rate: 16000
    channels: 2                   # XVF3800 USB: L = после AEC, R = луч для ASR
    asr_channel: 1
    monitor_channel: 0
    block_ms: 20
    frame_id: mic_array
    record_path: ""               # непустое -> пишет сырой многоканальный WAV

/**/vad_node:
  ros__parameters:
    window_samples: 512
    enter_threshold: 0.6          # ИЗМЕРИТЬ: подбирается по false-wake rate
    exit_threshold: 0.35
    min_speech_ms: 120
    min_silence_ms: 700
    barge_in_enabled: true
    barge_in_min_speech_ms: 200   # ИЗМЕРИТЬ: компромисс t_bargein vs ложные обрывы

/**/wakeword_node:
  ros__parameters:
    threshold: 0.6
    threshold_under_tts: 0.8      # ИЗМЕРИТЬ: поднят, пока не измерен ERLE
    refractory_ms: 1500
    cancel_scope: 0               # SCOPE_ALL

/**/asr_node:
  ros__parameters:
    streaming_model_dir: ""       # sherpa-onnx Zipformer, русский
    final_model: large-v3
    final_device: cuda
    final_compute_type: float16
    language: ru
    pre_roll_ms: 300              # без него теряется первый слог
    max_utterance_s: 30.0

/**/turn_detector:
  ros__parameters:
    base_timeout_ms: 700
    continuation_timeout_ms: 1400
    short_utterance_timeout_ms: 500
    short_utterance_words: 4

/**/tts_node:
  ros__parameters:
    backend: null                 # null | piper | silero
    model_path: ""
    voice: ""
    device: ""                    # пусто -> устройство по умолчанию
    channels: 2                   # hw: не конвертирует: сколько железо объявило
    block_ms: 20                  # верхняя граница остатка при отмене
    buffer_ms: 80                 # ИЗМЕРИТЬ: нижняя граница t_stop
    max_queue_ms: 600
    min_chars: 40
    max_chars: 160                # ~11 с аудио в полёте максимум
    chars_per_second: 14.0
    status_period: 0.2
    max_pending_goals: 8
