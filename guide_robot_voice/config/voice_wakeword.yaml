# Дополнительный opt-in оверлей ПОСЛЕ voice.yaml и voice_xvf3800.yaml.
# frames_07_room_op066: frames_06 + шум робота 15.10.2026, порог выбран по val.
/**/wakeword_node:
  ros__parameters:
    backend: oww
    model_bundle_path: "$(find-pkg-share guide_robot_voice)/models/firaya"

/**/voice_session_manager:
  ros__parameters:
    wakeword_gated: true
    command_window_seconds: 5.0
    followup_window_seconds: 8.0
    echo_hold_seconds: 0.4
    wakeword_barge_in_enabled: false
    allow_unvalidated_wakeword_barge_in: false
    wakeword_model_sha256: "99577fe4704d8e6494d5ae5368a07348486f5d3758932383c5566d74e3cd849b"
    wakeword_min_confidence: 0.66

/**/asr_node:
  ros__parameters:
    session_managed_input: true
    wakeword_gated_input: true
    wakeword_listen_during_tts: false
    gate_on_tts: false
    warmup_on_configure: true
    # 1200 мс обрезали имя при позднем срабатывании KWS, 2000 мс замедляли декод.
    pre_roll_ms: 1600.0
    command_pre_roll_ms: 160.0
    # Вето ложного KWS-кандидата: до trigger в расшифровке должно стоять слово,
    # близкое к «фирая» (взвешенный Левенштейн). Пусто/«пускай» окно не открывают.
    wake_confirm_max_distance: 3.0
    # Не расширять KWS/ASR fuzzy-лексикой. Первый wake fragment отделяется
    # по CTC таймингам; список ниже только fallback для отсутствующих метаданных.
    wakeword_only_phrases: ["фирая", "фирайя", "фира я", "фи рая"]
