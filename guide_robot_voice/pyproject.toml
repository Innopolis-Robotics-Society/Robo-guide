[tool.ruff]
line-length = 99
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "D", "UP", "B", "SIM", "ANN", "RUF", "PL", "SLF"]
# RUF001/002/003 -- "неоднозначные" кириллические символы. Для кодовой базы
# с русскими комментариями это сплошной шум: правило рассчитано на латиницу
# с вкраплениями гомоглифов, а не на текст целиком на кириллице.
# SIM905 разворачивает "слово слово".split() в список литералов. Для словарей
# сокращений на 60 элементов это делает диф нечитаемым, а строку -- на 400
# символов. Держим split().
ignore = ["D203", "D213", "ANN401", "RUF001", "RUF002", "RUF003", "SIM905"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"test/*" = ["ANN", "D", "SLF", "PLR2004"]
# PLC0415: импорты sounddevice/torch/piper отложены намеренно -- без них
# модуль должен импортироваться в CI, где ни звуковой карты, ни моделей нет.
# PLR0913/0917: конструкторы источников и стоков описывают конфигурацию
# устройства; сворачивать её в объект-параметр только ради счётчика аргументов
# смысла не имеет.
"guide_robot_voice/audio/*" = ["PLC0415", "PLR0913", "PLR0917"]
"guide_robot_voice/tts/backends.py" = ["PLC0415", "PLR0913", "PLR0917"]
"guide_robot_voice/nodes/*" = ["PLC0415", "PLR0913", "PLR0917"]
