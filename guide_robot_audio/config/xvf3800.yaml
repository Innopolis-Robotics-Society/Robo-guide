# Аппаратный профиль конкретной стендовой платы XVF3800.
#
# Значения подтверждены USB/UAC probe 20 сентября 2026 года. Номер ALSA
# card N намеренно не используется: он меняется при перезагрузке. Serial
# запрещает ноде молча открыть другую одноимённую плату или встроенный микрофон.
/**/xvf3800_audio_node:
  ros__parameters:
    expected_usb_serial: "101991441262500122"
    capture_device: "hw:CARD=Array,DEV=0"
    playback_device: "hw:CARD=Array,DEV=0"

    device_rate: 16000
    capture_channels: 2
    playback_channels: 2
    sample_format: "S16_LE"
    frame_ms: 16
    alsa_latency_us: 48000
    max_playback_queue_ms: 600
    max_pcm_block_ms: 2000
    playback_fade_ms: 20
    playback_state_hz: 20.0

    # Компьютерный стенд 2026-09-21: при playback-only channel 0 дал
    # -40.2 dBFS против -32.3 dBFS у channel 1, а человеческую речь сохранил
    # почти на том же уровне (-25.6 против -24.3 dBFS). Окончательно
    # подтвердить через Supra и динамики; смена не требует пересборки.
    processed_channel: 0
    publish_stereo_debug: false
    frame_id: "mic_array"
