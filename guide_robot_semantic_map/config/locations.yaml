# Координаты pose сняты по реальной карте лаборатории
# (guide_robot_navigation/map/lab_105_full.pgm, origin [-5.58, -15.7],
# resolution 0.05) -- согласованы с config/graph.geojson (полный mesh на
# тех же точках). yaw пока не измерен и везде 0.0 -- заменить на реальную
# ориентацию "лицом к экспонату" по месту.
version: 1
frame_id: map
locations:
  - id: entrance
    graph_node: 1
    pose: {x: 4.5, y: 7.6, yaw: 0.0}
    zone: lab
    category: waypoint
    is_public: true
    exhibit_id: entrance
    aliases:
      ru: ["вход", "главный вход"]
      en: ["entrance", "main entrance"]

  - id: robo_guide
    graph_node: 2
    pose: {x: 4.6, y: 4.1, yaw: 0.0}
    zone: lab
    category: exhibit
    is_public: true
    exhibit_id: robo_guide
    aliases:
      ru: ["робот-экскурсовод", "сам робот", "экскурсовод"]
      en: ["guide robot", "the robot itself"]

  - id: promobot_m13_artist
    graph_node: 3
    pose: {x: 0.7, y: 3.6, yaw: 0.0}
    zone: lab
    category: exhibit
    is_public: true
    exhibit_id: promobot_m13_artist
    aliases:
      ru: ["промобот", "промобот художник", "кобот"]
      en: ["promobot", "drawing robot"]

  - id: sam3_autolabeling
    graph_node: 4
    pose: {x: 7.8, y: 1.8, yaw: 0.0}
    zone: lab
    category: exhibit
    is_public: true
    exhibit_id: sam3_autolabeling
    aliases:
      ru: ["разметка данных", "sam3", "авторазметка"]
      en: ["autolabeling", "sam3"]

  - id: nav2_course
    graph_node: 5
    pose: {x: 15.2, y: 0.6, yaw: 0.0}
    zone: lab
    category: exhibit
    is_public: true
    exhibit_id: nav2_course
    aliases:
      ru: ["курс nav2", "тёртлботы", "turtlebot"]
      en: ["nav2 course", "turtlebot"]

  - id: livox_mid70
    graph_node: 7
    pose: {x: 0.5, y: -6.4, yaw: 0.0}
    zone: lab
    category: exhibit
    is_public: true
    exhibit_id: livox_mid70
    aliases:
      ru: ["лидар", "ливокс", "livox"]
      en: ["lidar", "livox mid-70"]

  # stage4 §3.1: сценическая экскурсия expo_one -- позы точек скопированы
  # с реальных точек лаборатории как заглушки (хореографии в этой версии
  # нет, площадка ещё не размечена). graph_node -- тот же узел, что у
  # копируемой точки: физически совпадающая позиция не создаёт нового
  # узла в графе проходимости.
  # TODO(Mook): реальная поза площадки (entrance -> точка встречи expo).
  - id: expo_meeting
    graph_node: 1
    pose: {x: 4.5, y: 7.6, yaw: 0.0}
    zone: expo
    category: exhibit
    is_public: true
    exhibit_id: expo_meeting
    aliases:
      ru: ["точка встречи", "место встречи", "знакомство с иннополисом", "иннополис", "анополис"]
      en: ["meeting point", "innopolis intro"]

  # TODO(Mook): реальная поза площадки (robo_guide -> макет города).
  - id: expo_city_model
    graph_node: 2
    pose: {x: 4.6, y: 4.1, yaw: 0.0}
    zone: expo
    category: exhibit
    is_public: true
    exhibit_id: expo_city_model
    aliases:
      ru: ["макет города", "макет Иннополиса", "макет"]
      en: ["city model"]

  # TODO(Mook): реальная поза площадки (promobot_m13_artist -> точка передачи гиду).
  - id: expo_handoff
    graph_node: 3
    pose: {x: 0.7, y: 3.6, yaw: 0.0}
    zone: expo
    category: exhibit
    is_public: true
    exhibit_id: expo_handoff
    aliases:
      ru: ["точка передачи", "передача гиду"]
      en: ["handoff point"]
