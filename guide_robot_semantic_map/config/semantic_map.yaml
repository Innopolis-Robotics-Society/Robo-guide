# Параметры трёх нод guide_robot_semantic_map.
#
# Пути к данным (*_file/*_dir) явно указаны на датасет Innopark (реальная
# площадка expo_one) -- пустая строка была бы сигналом нодам искать файл
# по умолчанию (config/graph.geojson и т.п. в share/guide_robot_semantic_map,
# см. _configure()/_resolve_path() в каждой ноде), а дефолт-фолбэк в коде
# всё ещё смотрит на лабораторный датасет ("для тестов", см. locations.yaml/
# tours.yaml). ParameterFile грузится с allow_substs=True (semantic_map.launch.py),
# поэтому $(find-pkg-share ...) здесь работает так же, как в
# guide_robot_voice/config/voice.yaml.
#
# graph_file здесь -- ОТДЕЛЬНЫЙ параметр от launch-аргумента graph_file,
# которым route_server (semantic_map.launch.py) грузит топологию: этот
# используется только location_server для валидации graph_node локаций.
# Меняются вместе, но не связаны ничем, кроме дисциплины (не забыть менять
# оба разом при смене площадки).
#
# Чтобы вернуться на лабораторный датасет для тестов -- переопределить
# ВСЕ ЧЕТЫРЕ пути разом (graph_file здесь, locations_file, tours_file,
# route_planner.locations_file) на *.geojson/*.yaml без суффикса
# "_innopark", и graph_file launch-аргумент semantic_map.launch.py тоже.

/**/content_server:
  ros__parameters:
    content_dir: ""
    default_language: "ru"

/**/location_server:
  ros__parameters:
    locations_file: "$(find-pkg-share guide_robot_semantic_map)/config/locations_innopark.yaml"
    tours_file: "$(find-pkg-share guide_robot_semantic_map)/config/tours_innopark.yaml"
    graph_file: "$(find-pkg-share guide_robot_semantic_map)/config/graph_innopark.geojson"
    default_language: "ru"
    near_radius_m: 5.0          # отсечка near_only=true, метры

/**/route_planner:
  ros__parameters:
    locations_file: "$(find-pkg-share guide_robot_semantic_map)/config/locations_innopark.yaml"
    nominal_speed_mps: 0.35     # ИЗМЕРИТЬ на роботе -- паспортная скорость, не эффективная
    crowd_factor: 0.7           # design.md §1.2: оценка должна быть пессимистичной
    turn_penalty_s: 3.0
    tsp_time_budget_ms: 200.0   # бюджет эвристики для N > 12 локаций (design.md §1.2)
    compute_route_call_timeout_s: 2.0
    route_server_wait_timeout_s: 10.0
