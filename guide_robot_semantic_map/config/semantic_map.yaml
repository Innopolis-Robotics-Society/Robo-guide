# Параметры нод guide_robot_semantic_map (content_server, location_server).
#
# Пути к данным (*_file/*_dir) явно указаны на датасет Innopark (текущая
# площадка, Технопарк/expo_one; прошлая -- ArtSpace, выборы 2026-09, файлы *_artspace.*) -- пустая строка была бы
# сигналом нодам искать файл по умолчанию (config/locations.yaml и т.п. в share/guide_robot_semantic_map,
# см. _configure()/_resolve_path() в каждой ноде), а дефолт-фолбэк в коде
# всё ещё смотрит на лабораторный датасет ("для тестов", см. locations.yaml/
# tours.yaml). ParameterFile грузится с allow_substs=True (semantic_map.launch.py),
# поэтому пути ниже пишутся через find-pkg-share substitution, как в
# guide_robot_voice/config/voice.yaml. ВАЖНО: allow_substs парсит подстановки
# по сырому тексту файла, включая комментарии -- дословный вид этой
# подстановки в комментарии (со знаком доллара и круглыми скобками) сюда
# специально не вставлен, иначе launch попытается её выполнить и упадёт
# с "is not a valid package name" на плейсхолдере вместо реального имени пакета.
#
# Чтобы вернуться на лабораторный датасет для тестов -- переопределить
# все пути разом (locations_file обеих нод, tours_file) на *.yaml без суффикса
# "_innopark" (или на "_artspace" для ArtSpace).

/**/content_server:
  ros__parameters:
    content_dir: ""
    default_language: "ru"
    # только для WARN-сверки location_ids контента; пусто -- лабораторный locations.yaml
    locations_file: "$(find-pkg-share guide_robot_semantic_map)/config/locations_innopark.yaml"

/**/location_server:
  ros__parameters:
    locations_file: "$(find-pkg-share guide_robot_semantic_map)/config/locations_innopark.yaml"
    tours_file: "$(find-pkg-share guide_robot_semantic_map)/config/tours_innopark.yaml"
    default_language: "ru"
    near_radius_m: 5.0          # отсечка near_only=true, метры
