# Локации площадки ArtSpace (избирательный участок №1259, выборы 2026-09),
# карта guide_robot_navigation/map/artspace_18.09_edited.yaml (origin
# [-6.85, -14.1], resolution 0.05) -- согласованы с
# config/graph_artspace.geojson (полный mesh на тех же точках). Координаты
# сняты через RViz Publish Point (/clicked_point) по месту. yaw не измерен.
#
# Экскурсии здесь нет: оператор гоняет робота из точки в точку
# `cli tour --locations vybory_N --no-greet --no-confirm --no-return-home`,
# по прибытии звучит content/vybory_N.ru.yaml (для явного location_ids
# exhibit_id = location_id, mission_fsm_node._resolve_tour).
version: 1
frame_id: map
locations:
  - id: vybory_1
    graph_node: 1
    pose: {x: 20.30748748779297, y: 1.2830647230148315, yaw: 0.0}
    zone: artspace
    category: exhibit
    is_public: true
    exhibit_id: vybory_1
    aliases:
      ru: ["первая точка", "точка один"]
      en: ["point one"]

  - id: vybory_2
    graph_node: 2
    pose: {x: 21.01218032836914, y: -1.284934163093567, yaw: 0.0}
    zone: artspace
    category: exhibit
    is_public: true
    exhibit_id: vybory_2
    aliases:
      ru: ["вторая точка", "точка два"]
      en: ["point two"]

  - id: vybory_3
    graph_node: 3
    pose: {x: 16.537731170654297, y: -0.6660043001174927, yaw: 0.0}
    zone: artspace
    category: exhibit
    is_public: true
    exhibit_id: vybory_3
    aliases:
      ru: ["третья точка", "точка три"]
      en: ["point three"]

  # База = P1 (vybory_1); дублирует mission.yaml home_pose и стартовую позу
# AMCL (guide_robot_navigation/config/first_iter_nav2.yaml.in). Скрыта от
  # пустого ListLocations (is_public=false), отдаётся по category=charging
  # (operator UI) -- см. config/locations.yaml.
  - id: home
    graph_node: 1
    pose: {x: 20.30748748779297, y: 1.2830647230148315, yaw: 0.0}
    zone: artspace
    category: charging
    is_public: false
