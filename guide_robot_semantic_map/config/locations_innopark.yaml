# Локации реальной площадки экскурсии expo_one ("Знакомство с Иннополисом"),
# карта guide_robot_navigation/map/innopark_l_10.09_edited.yaml (origin
# [-12.812, -15.298], resolution 0.05). Координаты сняты через RViz Publish Point (/clicked_point) по месту. yaw пока не
# измерен и везде 0.0 -- заменить на реальную ориентацию "лицом к
# экспонату"/"лицом в проход" по месту.
#
# expo_meeting/expo_city_model/expo_handoff -- те же три остановки, что были
# в config/locations.yaml лабораторной заглушкой (см. git-историю); теперь
# с реальными позами этой площадки. right_wing/left_wing --
# новые остановки, добавленные вместе с переездом; exhibit_id не задан --
# контента под них ещё нет (TODO(Mook): авторский текст в content/).
version: 1
frame_id: map
locations:
  - id: expo_meeting
    pose: {x: -0.18678855895996094, y: -0.029946327209472656, yaw: 0.0}
    zone: innopark
    category: exhibit
    is_public: true
    exhibit_id: expo_meeting
    aliases:
      ru: ["точка встречи", "место встречи", "знакомство с иннополисом", "иннополис", "анополис",
           "вход", "главный вход"]
      en: ["meeting point", "innopolis intro", "entrance"]

  - id: expo_city_model
    pose: {x: 17.917709350585938, y: 1.5098366737365723, yaw: 0.0}
    zone: innopark
    category: exhibit
    is_public: true
    exhibit_id: expo_city_model
    aliases:
      ru: ["макет города", "макет Иннополиса", "макет", "карта"]
      en: ["city model", "map"]

  - id: expo_handoff
    pose: {x: 11.985713958740234, y: 7.673947811126709, yaw: 0.0}
    zone: innopark
    category: exhibit
    is_public: true
    exhibit_id: expo_handoff
    aliases:
      ru: ["точка передачи", "передача гиду", "центр атриума", "атриум"]
      en: ["handoff point", "atrium center", "atrium"]

  # TODO(Mook): контент content/right_wing.ru.yaml не написан -- пока
  # немая остановка тура (exhibit_id тура указывает сюда же, содержимого
  # не найдёт content_server).
  - id: right_wing
    pose: {x: 16.27227783203125, y: -7.82863187789917, yaw: 0.0}
    zone: innopark
    category: waypoint
    is_public: true
    exhibit_id: null
    aliases:
      ru: ["правое крыло"]
      en: ["right wing"]

  # TODO(Mook): контент content/left_wing.ru.yaml не написан -- см.
  # right_wing выше.
  - id: left_wing
    pose: {x: 10.109298706054688, y: 16.306438446044922, yaw: 0.0}
    zone: innopark
    category: waypoint
    is_public: true
    exhibit_id: null
    aliases:
      ru: ["левое крыло"]
      en: ["left wing"]

  # Служебные базы робота: скрыты от пустого ListLocations (is_public=false),
  # отдаются по category=charging -- кнопки «Стоянка»/«Подзарядка» operator UI
  # (mission_fsm ~/go_to_base) и «Сброс локализации» (берёт parking).
  # Позы сняты tf2_echo map base_link в симуляторе 2026-10-22.
  #
  # «Начало экскурсии» (кнопка, бывшая «Домой») -- не локация, а mission.yaml
  # home_pose = expo_meeting: туда тур возвращается в конце.

  # Стоянка: отсюда робот стартует -- дублирует стартовую позу AMCL
  # (guide_robot_navigation/config/first_iter_nav2.yaml.in) и spawn в
  # Gazebo (guide_robot_bringup/launch/simulation.launch.py).
  - id: parking
    pose: {x: 20.686, y: 1.027, yaw: -0.218}
    zone: innopark
    category: charging
    is_public: false

  - id: charging
    pose: {x: -2.275, y: 0.780, yaw: -2.881}
    zone: innopark
    category: charging
    is_public: false
