exhibit_id: expo_city_model
language: ru
version: "2026-08-29.1"
reviewed_by: ""
title: "Макет Иннополиса"
# Продолжение нарезки expo_one.md (stage4 §4) -- от макета города до
# передачи гиду. "[Робот поворачивается к макету]" убрана (хореографии
# нет). Факты про университет/ОЭЗ сверены с innopolis_city.ru.yaml/
# innopolis_university.ru.yaml -- противоречий не внесено.
chunks:
  - {id: c1, level: short, interruptible: true,
     text: "Вот он — Иннополис в миниатюре. Сейчас вы можете увидеть основные элементы городской среды. Обратите внимание, как здесь всё расположено."}
  - {id: c2, level: full, interruptible: true,
     text: "Город задуман не просто как набор зданий. Здесь рядом существуют жилые пространства, университет, технологическая инфраструктура, общественные зоны, спортивные объекты и места для работы."}
  - {id: c3, level: full, interruptible: false, pause_after_s: 1.0,
     text: "То есть идея примерно такая: не нужно тратить полтора часа на дорогу до работы, потом ещё час на дорогу до университета, а потом ещё сорок минут, чтобы найти место, где можно нормально поесть. Всё должно быть рядом."}
  - {id: c4, level: full, interruptible: false, pause_after_s: 2.0,
     text: "И это очень удобно. Особенно если вы программист. Потому что программисту иногда проще написать программу для перемещения по городу, чем просто выйти из дома."}

  - {id: c5a, level: full, interruptible: true,
     text: "Давайте небольшая игра. Посмотрите на макет."}
  - {id: c5b, level: full, interruptible: true, pause_after_s: 8.0,
     text: "Представьте, что вы приехали сюда через 10 лет. Как вы думаете, что здесь изменится?"}
  - {id: c6a, level: full, interruptible: true,
     text: "Роботов станет больше? Беспилотников?"}
  - {id: c6b, level: full, interruptible: true, pause_after_s: 1.0,
     text: "Новых технологий? Может быть, появятся роботы-учителя?"}
  - {id: c7, level: full, interruptible: false, pause_after_s: 1.0,
     text: "Хотя… Если появятся роботы-учителя, я хочу официально заявить: я не буду проверять домашние задания."}
  - {id: c8, level: full, interruptible: false, pause_after_s: 2.0,
     text: "У меня и так процессор перегружен."}

  - {id: c9, level: full, interruptible: true,
     text: "Иннополис создавался вокруг идеи развития цифровой экономики, образования, науки и высоких технологий. Здесь особая роль отведена Университету Иннополис и технологической инфраструктуре."}
  - {id: c10, level: full, interruptible: true,
     text: "И получается интересная система: человек может прийти сюда учиться, потом начать заниматься исследованиями, потом создать технологический проект, потом открыть компанию, а затем эта компания может стать частью экосистемы города."}
  - {id: c11, level: full, interruptible: true,
     text: "То есть путь может выглядеть примерно так: школьник, студент, разработчик, предприниматель, резидент ОЭЗ."}
  - {id: c12, level: full, interruptible: false, pause_after_s: 2.0,
     text: "А иногда ещё: школьник, студент, разработчик, предприниматель, миллионер. Но этот этап в инструкции мне почему-то не прописали."}

  - {id: c13, level: full, interruptible: true,
     text: "Здесь развиваются самые разные технологические направления. В экосистеме Иннополиса представлены информационные технологии, робототехника, информационная безопасность, искусственный интеллект, электроника, беспилотные системы и другие направления."}
  - {id: c14, level: full, interruptible: true,
     text: "Например, технопарки создают инфраструктуру для технологических компаний и проектов."}
  # Последний чанк остановки -- переход к передаче гиду.
  - {id: c15, level: short, interruptible: true,
     text: "И вот здесь мы подходим к следующей части нашей экскурсии."}
