exhibit_id: expo_city_model
language: ru
version: "2026-09-24.1"
reviewed_by: ""
title: "Макет Иннополиса"
# Продолжение нарезки expo_one.md (stage4 §4) -- от макета города до
# передачи гиду. "[Робот поворачивается к макету]" убрана (хореографии
# нет). Факты про университет/ОЭЗ сверены с innopolis_city.ru.yaml/
# innopolis_university.ru.yaml -- противоречий не внесено.
chunks:
  - {id: c1, level: short, interruptible: false,
     text: "Вот он — Иннополис в миниатюре. Обратите внимание, как здесь всё расположено."}
  - {id: c2, level: full, interruptible: false,
     text: "Жильё, университет, технопарки, спорт и места для работы — всё рядом. Не нужно полтора часа ехать до офиса, а потом ещё час до университета."}
  - {id: c3, level: full, interruptible: false, pause_after_s: 1.0,
     text: "Особенно удобно программистам: им иногда проще написать программу для перемещения по городу, чем просто выйти из дома."}

  - {id: c4a, level: full, interruptible: false, pause_after_s: 1.0,
     text: "Небольшая игра: представьте, что вы приехали сюда через десять лет. Что здесь изменится?"}
  - {id: c4b, level: full, interruptible: false, pause_after_s: 0.0,
     text: "Больше роботов и беспилотников? А может быть, появятся роботы-учителя?"}
  - {id: c5, level: full, interruptible: false, pause_after_s: 1.0,
     text: "Сразу заявляю: домашние задания я проверять не буду. У меня и так процессор перегружен."}

  - {id: c6, level: full, interruptible: false,
     text: "Город построен вокруг Университета Иннополис и технологической инфраструктуры. Путь здесь может выглядеть так: школьник, студент, разработчик, предприниматель, резидент особой экономической зоны."}
  - {id: c7, level: full, interruptible: false, pause_after_s: 1.0,
     text: "Иногда в конце добавляют ещё «миллионер». Но этот этап мне в инструкции почему-то не прописали."}
  - {id: c8, level: full, interruptible: false,
     text: "Здесь развиваются ай-ти, робототехника, искусственный интеллект, информационная безопасность, электроника и беспилотные системы."}
  # Последний чанк остановки -- переход к передаче гиду.
  - {id: c9, level: short, interruptible: false,
     text: "И вот мы подходим к следующей части нашей экскурсии."}

