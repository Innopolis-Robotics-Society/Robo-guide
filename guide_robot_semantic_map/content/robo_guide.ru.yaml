language: ru
version: "2026-08-04.1"
reviewed_by: "Evgenii Shlomov"
reviewed_at: "2026-08-04"
title: "Робот-экскурсовод"
chunks:
  - {id: c1, level: short, text: "Это первый действующий прототип робота-гида, которого вы видите перед собой."}
  - {id: c2, level: short, text: "Для него спроектирована многоуровневая система безопасности: программный, аварийный и независимый аппаратный контуры."}
  - {id: c3, level: full,  text: "Навигационный стек построен на ROS 2 Humble: slam_toolbox отвечает за картографирование, AMCL — за локализацию, а Nav2 — за планирование маршрута с объездом препятствий."}
  - {id: c4, level: full,  text: "Архитектура супервайзера переводит робота между состояниями BRINGUP, READY и FAULT, чтобы система безопасно восстанавливалась после сбоя отдельных узлов."}
  - {id: c5, level: full,  text: "Платформа весит 25 килограммов и развивает скорость до 0,5 метра в секунду — этого достаточно для спокойной прогулки по залам."}
