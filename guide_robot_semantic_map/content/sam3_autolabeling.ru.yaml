exhibit_id: sam3_autolabeling
language: ru
version: "2026-08-04.1"
reviewed_by: "Evgenii Shlomov"
reviewed_at: "2026-08-04"
title: "Автоматическая разметка данных SAM3"
chunks:
  - {id: c1, level: short, text: "Для ускорения подготовки датасетов мы построили пайплайн автоматической разметки изображений на основе модели SAM3."}
  - {id: c2, level: short, text: "Он работает на изолированном JupyterHub без доступа к интернету — специально для работы с закрытыми данными."}
  - {id: c3, level: full,  text: "Одной из сложностей было несовпадение форматов весов: модель ожидала формат Hugging Face transformers, а исходно веса были в «сыром» формате Meta."}
  - {id: c4, level: full,  text: "В результате разметка объектов на изображениях, которая раньше делалась вручную, теперь занимает в разы меньше времени."}
