exhibit_id: livox_mid70
language: ru
version: "2026-08-04.1"
reviewed_by: "Evgenii Shlomov"
reviewed_at: "2026-08-04"
title: "Интеграция лидара Livox MID-70"
chunks:
  - {id: c1, level: short, text: "Мы интегрировали твердотельный лидар Livox MID-70 в ROS 2 через Docker на основе форка драйвера SDK1."}
  - {id: c2, level: short, text: "Такой лидар даёт плотное 3D-облако точек и хорошо подходит для картографирования сложных помещений."}
  - {id: c3, level: full,  text: "Отличие MID-70 от классических вращающихся лидаров — в нерегулярном сканирующем паттерне, который требует особого подхода к накоплению точек."}
  - {id: c4, level: full,  text: "Интеграция включала настройку драйвера, преобразование системы координат и проверку синхронизации по времени с остальными сенсорами робота."}
  - {id: c5, level: full,  text: "Полученные данные используются как основа для сравнения с показаниями 2D-лидара при построении карты зала."}
