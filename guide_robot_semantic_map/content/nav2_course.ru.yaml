exhibit_id: nav2_course
language: ru
version: "2026-08-04.1"
reviewed_by: "Evgenii Shlomov"
reviewed_at: "2026-08-04"
title: "Курс по Nav2 для студентов"
chunks:
  - {id: c1, level: short, text: "Мы разработали учебный блок по стеку навигации Nav2 для студентов, изучающих робототехнику."}
  - {id: c2, level: short, text: "Занятия проходят на роботах TurtleBot3 Waffle, запущенных в Docker-контейнерах."}
  - {id: c3, level: full,  text: "Материалы оформлены как пошаговые тетради Jupyter: студенты настраивают параметры Nav2, собирают деревья поведений и экспериментируют с локализацией AMCL."}
  - {id: c4, level: full,  text: "Похожий формат мы использовали и в мастер-классе по ROS 2 для школьников — с отдельной Docker-инфраструктурой и анимированной презентацией."}
  - {id: c5, level: full,  text: "Такой подход позволяет учащимся сразу видеть эффект от изменения параметров, а не просто читать теорию."}
