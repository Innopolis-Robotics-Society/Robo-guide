title: "Университет Иннополис"
chunks:
  - {id: c1, level: short, text: "Университет Иннополис готовит специалистов по информационным технологиям: разработку программного обеспечения, робототехнику, кибербезопасность и науку о данных. Обучение ведётся на английском и русском языках, часть курсов читают приглашённые преподаватели из индустрии."}
  - {id: c2, level: full, text: "Рядом с университетом работает особая экономическая зона \"Иннополис\" — здесь размещаются офисы ИТ-компаний-резидентов, которые сотрудничают с университетом по студенческим проектам, стажировкам и совместным исследованиям."}
