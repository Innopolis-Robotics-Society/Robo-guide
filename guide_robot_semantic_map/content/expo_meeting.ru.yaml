exhibit_id: expo_meeting
language: ru
version: "2026-08-29.1"
reviewed_by: ""
title: "Знакомство и приглашение в Иннополис"
# Нарезка сценического монолога expo_one.md (stage4 §4) до перехода к
# макету города -- сценические ремарки убраны (хореографии нет),
# [ИМЯ РОБОТА] -- заглушка "Робо-гид" (# TODO(Mook): имя робота).
# interruptible:false -- связки "сетап -> панч", перебивать которые
# ломает шутку; pause_after_s -- комедийные паузы/окна вопросов на
# границах секций, значения по п.5 приёмки поправить на слух.
chunks:
  - {id: m1, level: short, interruptible: false,
     text: "Здравствуйте, люди! То есть… уважаемые гости!"}
  - {id: m2, level: full, interruptible: false, pause_after_s: 1.0,
     text: "Добро пожаловать в Иннополис — город, где будущее уже наступило, а некоторые его жители до сих пор не поняли, что они живут в будущем."}
  # TODO(Mook): имя робота -- заглушка "Робо-гид".
  - {id: m3a, level: full, interruptible: true,
     text: "Меня зовут… Робо-гид."}
  - {id: m3b, level: full, interruptible: true,
     text: "Я робот. Но, пожалуйста, не пугайтесь."}
  - {id: m4, level: full, interruptible: false, pause_after_s: 1.0,
     text: "Я добрый. По крайней мере, так написано в моей инструкции."}
  - {id: m5, level: full, interruptible: true,
     text: "А если серьёзно — сегодня я буду вашим первым цифровым знакомым в Иннополисе. А дальше вас передадут человеку."}
  - {id: m6a, level: full, interruptible: false,
     text: "Да-да. Человеку. Удивительная технология."}
  - {id: m6b, level: full, interruptible: false, pause_after_s: 2.0,
     text: "Человек умеет рассказывать про технологии без зарядки и даже без Wi-Fi."}

  - {id: m7, level: short, interruptible: true,
     text: "Вы сейчас находитесь в Иннополисе — молодом российском городе, который создавался как среда для развития IT, науки, образования и новых технологий."}
  - {id: m8, level: full, interruptible: true,
     text: "Здесь рядом находятся университет, технопарки, компании, лаборатории, жилые кварталы, спортивная инфраструктура и множество технологических сервисов."}
  - {id: m9, level: full, interruptible: false, pause_after_s: 1.0,
     text: "То есть здесь можно утром пойти учиться программированию, днём встретить робота, вечером заказать еду… А ночью задуматься: «А точно ли это я живу в городе или уже внутри компьютерной игры?»"}
  - {id: m10, level: full, interruptible: false, pause_after_s: 2.0,
     text: "Спойлер: вы в городе. Пока."}

  - {id: m11, level: full, interruptible: true,
     text: "А теперь немного серьёзной информации. Иннополис — это не просто город с красивыми зданиями и большим количеством людей с ноутбуками."}
  - {id: m12a, level: short, interruptible: true,
     text: "Здесь находится особая экономическая зона «Иннополис». Что такое особая экономическая зона?"}
  - {id: m12b, level: full, interruptible: true,
     text: "Представьте, что государство говорит технологическим компаниям: «Ребята, приходите к нам, развивайте новые технологии, создавайте продукты и рабочие места. А мы создадим для вас особые условия для работы»."}
  - {id: m13, level: full, interruptible: true,
     text: "Именно поэтому для компаний-резидентов ОЭЗ предусмотрены специальные условия и налоговые преференции. Например, для резидентов ОЭЗ «Иннополис» предусмотрены льготные условия по налогу на прибыль, а также определённые льготы по имущественным и другим налогам. Конкретные ставки и сроки зависят от действующего законодательства и условий резидентства."}
  - {id: m14, level: full, interruptible: false, pause_after_s: 1.5,
     text: "Если коротко: обычная компания говорит — нам бы помещение. Компания в Иннополисе говорит — нам бы лабораторию, инженеров, программистов, роботов, искусственный интеллект… А Иннополис отвечает — хорошо."}
  - {id: m15, level: full, interruptible: true, pause_after_s: 2.0,
     text: "Именно поэтому здесь появляются технологии, которые потом могут использоваться далеко за пределами города."}

  - {id: m16, level: full, interruptible: false, pause_after_s: 1.0,
     text: "Кстати, наверняка вы уже слышали про роботов-доставщиков. Если увидите одного из них на улице — не удивляйтесь. Это мои родственники."}
  - {id: m17, level: full, interruptible: true,
     text: "Правда, мы не очень похожи. Они ездят по тротуарам, доставляют еду и посылки. Я пока в основном доставляю информацию."}
  - {id: m18, level: full, interruptible: false, pause_after_s: 1.0,
     text: "Но, между нами говоря, у них работа попроще. Они приехали, сказали «ваш заказ» — и уехали. А я должен говорить десять минут."}
  - {id: m19, level: full, interruptible: false, pause_after_s: 2.0,
     text: "Так что, если встретите робота-доставщика, передавайте привет от меня. Только не просите его рассказать экскурсию — у него тариф за дополнительные слова."}

  - {id: m20, level: full, interruptible: true,
     text: "Иннополис также известен экспериментами с беспилотным транспортом. Здесь можно увидеть, как технологии постепенно переходят из лабораторий в обычную городскую жизнь."}
  - {id: m21, level: full, interruptible: true,
     text: "И это, пожалуй, одна из самых интересных особенностей Иннополиса. Потому что технология здесь — это не просто экспонат за стеклом. Она может быть частью повседневной жизни."}
  - {id: m22a, level: full, interruptible: true,
     text: "Транспорт. Роботы. Искусственный интеллект."}
  - {id: m22b, level: full, interruptible: true, pause_after_s: 1.5,
     text: "Автоматизация. Цифровые сервисы. Всё это становится частью городской среды."}

  - {id: m23, level: full, interruptible: false, pause_after_s: 1.0,
     text: "А сейчас предлагаю посмотреть на Иннополис сверху. Нет, я не предлагаю вам взлететь. Хотя…"}
  # Последний чанк остановки -- дальше NAVIGATING к макету молча
  # (transit-нарратив для expo_one не задан, tours.yaml).
  - {id: m24, level: full, interruptible: false,
     text: "Технически было бы интересно. Но экскурсовод потом очень расстроится. Поэтому посмотрим на макет."}
