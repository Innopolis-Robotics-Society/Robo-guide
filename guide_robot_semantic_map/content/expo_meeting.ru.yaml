exhibit_id: expo_meeting
language: ru
version: "2026-09-24.1"
reviewed_by: ""
title: "Знакомство и приглашение в Иннополис"
# Нарезка сценического монолога expo_one.md (stage4 §4) до перехода к
# макету города -- сценические ремарки убраны (хореографии нет),
# [ИМЯ РОБОТА] -- "Фирая" (женский род во всех репликах от первого лица).
# interruptible:false -- связки "сетап -> панч", перебивать которые
# ломает шутку; pause_after_s -- комедийные паузы/окна вопросов на
# границах секций, значения по п.5 приёмки поправить на слух.
chunks:
  - {id: m1, level: short, interruptible: false,
     text: "Здравствуйте, люди! То есть… уважаемые гости!"}
  - {id: m2, level: full, interruptible: false,
     text: "Добро пожаловать в Иннополис — город, где будущее уже наступило."}
  - {id: m3, level: full, interruptible: false, pause_after_s: 0.0,
     text: "Меня зовут Фирая. Я робот, но, пожалуйста, не пугайтесь: я добрая. По крайней мере, так написано в моей инструкции."}
  - {id: m4, level: full, interruptible: false, pause_after_s: 1.0,
     text: "Сегодня я ваша первая цифровая знакомая в Иннополисе, а дальше вас передадут человеку. Да-да, человеку. Он умеет рассказывать про технологии без зарядки и даже без Вай Фай."}

  - {id: m5, level: short, interruptible: false,
     text: "Иннополис — молодой российский город, созданный для развития ай-ти, науки и образования. Здесь рядом университет, технопарки, компании и жилые кварталы."}
  - {id: m6, level: full, interruptible: false, pause_after_s: 1.0,
     text: "Утром можно учиться программированию, днём встретить робота, а ночью задуматься: а не внутри ли я компьютерной игры? Спойлер: вы в городе. Пока."}

  - {id: m7, level: short, interruptible: false,
     text: "Здесь работает особая экономическая зона «Иннополис». Государство как бы говорит компаниям: приходите, создавайте технологии и рабочие места, а мы дадим вам особые условия."}
  - {id: m8, level: full, interruptible: false,
     text: "Для резидентов зоны предусмотрены налоговые льготы — по налогу на прибыль, имуществу и другим. Конкретные ставки зависят от действующего законодательства."}
  - {id: m9, level: full, interruptible: false, pause_after_s: 1.0,
     text: "Если коротко: обычная компания просит помещение. Компания в Иннополисе просит лабораторию, инженеров, роботов и искусственный интеллект. А Иннополис отвечает — хорошо."}

  - {id: m10, level: full, interruptible: false, pause_after_s: 1.0,
     text: "Кстати, если увидите на улице робота-доставщика — это мой родственник. Он возит еду и посылки, а я — информацию. Только работа у него попроще: сказал «ваш заказ» и уехал."}
  - {id: m11, level: full, interruptible: false, pause_after_s: 1.0,
     text: "А ещё здесь испытывают беспилотный транспорт. Роботы, искусственный интеллект, цифровые сервисы — в Иннополисе это не экспонаты за стеклом, а часть обычной жизни."}

  # Последний чанк остановки -- дальше NAVIGATING к макету молча
  # (transit-нарратив для expo_one не задан, tours.yaml).
  - {id: m12, level: full, interruptible: false,
     text: "А теперь посмотрим на Иннополис сверху. Нет, взлетать не будем — экскурсовод расстроится. Посмотрим на макет."}

