title: "Иннополис"
chunks:
  - {id: c1, level: short, text: "Иннополис — небольшой город в Татарстане, построенный как центр информационных технологий. Здесь расположены Университет Иннополис, резиденты особой экономической зоны и жилые кварталы для студентов и сотрудников ИТ-компаний. Город рассчитан на несколько тысяч жителей и активно растёт вместе с университетом."}
  - {id: c2, level: full, text: "Университет Иннополис открылся в две тысячи тринадцатом году как проект подготовки инженерных кадров для российской ИТ-отрасли. Первый набор студентов был небольшим — программа развивалась постепенно, добавляя новые направления и лаборатории по мере роста университета."}
  - {id: c3, level: full, text: "За прошедшие годы кампус вырос: появились новые учебные корпуса, общежития и лаборатории, включая направление робототехники и компьютерного зрения, в рамках которого разрабатывается и этот робот-экскурсовод."}
