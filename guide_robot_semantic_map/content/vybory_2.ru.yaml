title: "Выборы: что сегодня в Артспейсе"
# ArtSpace, точка 2.
chunks:
  - {id: v2a, level: short, interruptible: false,
     text: "Привет! Это Фирая. Какие у вас планы на сегодня?"}
  - {id: v2b, level: full, interruptible: false,
     text: "У меня — знакомиться с людьми и приглашать на выборы. Пожалуй, этим и займусь — заходи на избирательный участок в Артспейсе."}
  - {id: v2c, level: full, interruptible: false,
     text: "Тут сегодня много интересного — роботы, презентация цифрового двойника города, шоукейс игр, разработанных в Иннополисе, блинчики, если ещё не все съели, и вакцинация от гриппа."}
  - {id: v2d, level: full, interruptible: false,
     text: "Приходи выбирать депутатов Государственной Думы и Совета депутатов Иннополиса."}
