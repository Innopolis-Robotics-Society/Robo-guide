chunks:
  - {id: c1, level: short, text: "Пока идём — пара слов о лаборатории: здесь занимаются робототехникой и компьютерным зрением студенты и сотрудники Университета Иннополис."}
  - {id: c2, level: short, text: "Все экспонаты на этом стенде — рабочие прототипы, а не макеты: их собирают и дорабатывают прямо здесь."}
  - {id: c3, level: short, text: "Дальше по маршруту будет ещё несколько остановок — на каждой я коротко расскажу, что перед вами."}
