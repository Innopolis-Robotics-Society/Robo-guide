exhibit_id: promobot_m13_artist
language: ru
version: "2026-08-04.1"
reviewed_by: "Evgenii Shlomov"
reviewed_at: "2026-08-04"
title: "Промобот-художник"
chunks:
  - {id: c1, level: short, text: "На День города Иннополиса в июне 2026 года кобот Promobot M13 самостоятельно рисовал открытки с надписью «Инно 2026»."}
  - {id: c2, level: short, text: "Робот держал маркер, вычерчивал буквы по заданной траектории и передавал готовую открытку гостям."}
  - {id: c3, level: full,  text: "Управление строилось через прямое Ethernet-подключение к контроллеру робота, а команды старта и смены пера подавались через цифровые входы платы ESP."}
  - {id: c4, level: full,  text: "Траектории рисования были заранее просчитаны и записаны в виде скрипта, который кобот исполнял без вмешательства оператора."}
  - {id: c5, level: full,  text: "Проект показал, что манипулятор, обычно работающий на производстве, можно использовать и для творческих задач."}
