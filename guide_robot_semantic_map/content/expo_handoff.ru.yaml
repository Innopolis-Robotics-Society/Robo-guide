exhibit_id: expo_handoff
language: ru
version: "2026-08-29.1"
reviewed_by: ""
title: "Передача гиду"
# Финальная часть нарезки expo_one.md (stage4 §4) -- передача группы
# человеку-гиду и прощание. "[Робот смотрит на гида]"/"[Обращение к
# группе]"/"[Робот отъезжает / поворачивается к гиду]" убраны
# (хореографии нет, реплики группе идут тем же голосом без адресации).
chunks:
  - {id: h1, level: short, interruptible: true,
     text: "Сегодня вы увидите один из главных объектов технологической инфраструктуры Иннополиса — Технопарк имени А.С. Попова."}
  - {id: h2a, level: full, interruptible: true,
     text: "Это уже не макет. Не картинка. И не презентация."}
  - {id: h2b, level: full, interruptible: true,
     text: "Это настоящее пространство, связанное с работой технологических компаний и развитием инновационных проектов."}
  - {id: h3, level: full, interruptible: true,
     text: "И сейчас самое время передать вас человеку."}
  - {id: h4, level: full, interruptible: false, pause_after_s: 1.0,
     text: "Человеку, который знает город лучше меня. Хотя…"}
  - {id: h5, level: full, interruptible: false, pause_after_s: 2.0,
     text: "У него есть один серьёзный недостаток. Он не умеет заряжаться от розетки. Поэтому ему иногда приходится делать перерывы."}

  - {id: h6, level: full, interruptible: true,
     text: "Итак, сегодня вы увидите Иннополис не просто как красивый современный город. Вы увидите, как здесь устроена технологическая среда."}
  - {id: h7, level: full, interruptible: true,
     text: "Мы поговорим о том, как создаются новые продукты, где работают специалисты, как устроены технопарки и почему такие города становятся площадками для развития технологий."}
  - {id: h8, level: full, interruptible: true,
     text: "А затем отправимся на обзорную экскурсию по самому Иннополису."}
  - {id: h9a, level: full, interruptible: false,
     text: "Возможно, встретим моих родственников. Если увидите робота-доставщика — улыбнитесь ему."}
  - {id: h9b, level: full, interruptible: false, pause_after_s: 1.5,
     text: "Он тоже работает. Просто молча. И, возможно, зарабатывает больше меня."}

  - {id: h10a, level: short, interruptible: true,
     text: "Добро пожаловать в Иннополис!"}
  - {id: h10b, level: full, interruptible: true,
     text: "Город, где будущее можно не только представить… но и встретить на улице. Хорошей экскурсии!"}
  - {id: h11, level: full, interruptible: false, pause_after_s: 0.8,
     text: "И помните: если технология работает — это инновация. Если технология не работает — это эксперимент. А если после эксперимента всё заработало — это Иннополис."}
  - {id: h12, level: full, interruptible: false,
     text: "До встречи!"}
