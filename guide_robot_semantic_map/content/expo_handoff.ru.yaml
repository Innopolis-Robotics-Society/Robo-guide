exhibit_id: expo_handoff
language: ru
version: "2026-09-24.1"
reviewed_by: ""
title: "Передача гиду"
# Финальная часть нарезки expo_one.md (stage4 §4) -- передача группы
# человеку-гиду и прощание. "[Робот смотрит на гида]"/"[Обращение к
# группе]"/"[Робот отъезжает / поворачивается к гиду]" убраны
# (хореографии нет, реплики группе идут тем же голосом без адресации).
chunks:
  - {id: h1, level: short, interruptible: false,
     text: "Сейчас вы увидите один из главных объектов Иннополиса — Технопарк имени А Эс Попова. Это уже не макет и не презентация, а настоящее рабочее пространство."}
  - {id: h2, level: full, interruptible: false, pause_after_s: 1.0,
     text: "Дальше вас поведёт человек, который знает город лучше меня. Правда, у него есть серьёзный недостаток: он не умеет заряжаться от розетки."}
  - {id: h3, level: full, interruptible: false,
     text: "Вы узнаете, как здесь создают новые продукты и как устроены технопарки, а потом отправитесь на обзорную экскурсию по городу."}

  - {id: h4, level: short, interruptible: false,
     text: "Добро пожаловать в Иннополис!"}
  - {id: h5, level: full, interruptible: false, pause_after_s: 1.0,
     text: "И помните: если технология работает — это инновация. Если не работает — это эксперимент. А если после эксперимента всё заработало — это Иннополис."}
  - {id: h6, level: full, interruptible: false,
     text: "Хорошей экскурсии и до встречи!"}

